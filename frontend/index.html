    if (this.playing) {
      this.loopCount = 1;
      this.advanceArmed = false;
      this._softRestartAt(pos);
    } else {
      this.segIndex = this._segAt(pos);
      this.pendingPos = pos;
      this.onState();
    }
  }
  advance() {
    if (!this.playing) return;
    if (this.transitionMode === 'phrase' && this.downbeats.length) {
      this._advanceAtPhrase();
    } else {
      this.advanceArmed = true;
    }
    this.onState();
  }
  // Transition at a musical phrase boundary (a multiple of phraseBars bars
  // from the current chunk's start), without waiting for the loop end. A bar
  // is too small a unit: the theme should finish, so by default phrase = 4 bars.
  _advanceAtPhrase() {
    const pos = this.position();
    if (pos == null) return;
    if (this.segIndex + 1 >= this.segments.length) { this.advanceArmed = true; return; }
    const seg = this.segments[this.segIndex];
    const margin = 0.12; // sec for scheduling
    // phrase counting anchor — the start of the current loop pass
    const cur = this.queue.length ? this.queue[this.queue.length - 1] : null;
    const anchor = cur ? cur.trackStart : seg.start;
    // downbeats inside the part, starting from the anchor
    const dbs = this.downbeats.filter(b => b >= anchor - 0.05 && b < seg.end - 0.05);
    const nBars = this.phraseBars || 4;
    // candidates: every nBars-th downbeat from the anchor
    let target = null;
    for (let k = nBars; k < dbs.length; k += nBars) {
      if (dbs[k] > pos + margin) { target = dbs[k]; break; }
    }
    // no phrase boundary ahead — play the loop to its end (normal mode)
    if (target == null) { this.advanceArmed = true; return; }
    const now = this.ctx.currentTime;
    const Tt = now + (target - pos) / (this.rate || 1);
    const nextSeg = this.segments[this.segIndex + 1];
    const xf = Math.max(this.crossfade, 0.03);
    // fade out everything current by time Tt (+xf tail)
    this.sources.forEach(({ g }) => {
      try {
        g.gain.cancelScheduledValues(Tt);
        g.gain.setValueAtTime(g.gain.value, Tt);
        const N = 6;
        for (let k = 1; k <= N; k++)
          g.gain.linearRampToValueAtTime(Math.cos((k / N) * Math.PI / 2), Tt + xf * k / N);
      } catch (e) {}
    });
    const olds = this.sources.slice();
    setTimeout(() => olds.forEach(s => { try { (s.stopAll || (() => s.src.stop()))(); } catch (e) {} }),
               (Tt - now + xf + 0.1) * 1000);
    this.sources = [];
    // the new part from its beginning
    this.nextTime = Tt;
    const dur = this._scheduleChunkRange(nextSeg.start, nextSeg.end, Tt,
                                         this.crossfade > 0.02 ? xf : null, null);
    if (nextSeg.stinger && nextSeg.stinger !== 'none')
      this._playStinger(nextSeg.stinger, Tt);
    this.queue = [
      { t0: now, t1: Tt, segIndex: this.segIndex, trackStart: pos, isLoopRepeat: false },
      { t0: Tt, t1: Tt + dur, segIndex: this.segIndex + 1,
        trackStart: nextSeg.start, isLoopRepeat: false },
    ];
    this.lastPlannedIndex = this.segIndex + 1;
    this.nextTime = Tt + dur;
  }
  stop(notify = true) {
    this.playing = false;
    this.advanceArmed = false;
    clearTimeout(this._reschedT);
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    this.sources.forEach(s => { try { (s.stopAll || (() => s.src.stop()))(); } catch (e) {} });
    this.sources = [];
    this.queue = [];
    if (notify) this.onState();
  }
  position() {
    if (!this.playing || !this.ctx || !this.queue.length) return null;
    const now = this.ctx.currentTime;
    let cur = this.queue[0];
    for (const q of this.queue) if (q.t0 <= now) cur = q;
    if (now < cur.t0) return cur.trackStart;
    return cur.trackStart + (now - cur.t0) * (this.rate || 1);
  }
}

// ============================== Waveform ===================================
function Waveform({ buffer, segments, setSegments, beats, downbeats, snap,
                    player, playingSeg, duration, onSeekSeg, t,
                    beginEdit, commitEdit, aiWorking }) {
  const canvasRef = useRef(null);
  const peaksRef = useRef(null);
  const dragRef = useRef(null);
  const viewRef = useRef({ t0: 0, t1: 0 }); // visible window (sec); t1=0 -> whole track
  const [, force] = useState(0);
  const H = 420;

  useEffect(() => {
    if (!buffer) { peaksRef.current = null; return; }
    const W = 8192; // enough for zooming
    const data = buffer.getChannelData(0);
    const step = Math.max(1, Math.floor(data.length / W));
    const peaks = new Float32Array(W * 2);
    for (let i = 0; i < W; i++) {
      let mn = 1, mx = -1;
      const s = i * step, e = Math.min(s + step, data.length);
      for (let j = s; j < e; j += 2) { const v = data[j]; if (v < mn) mn = v; if (v > mx) mx = v; }
      peaks[i * 2] = mn; peaks[i * 2 + 1] = mx;
    }
    peaksRef.current = { peaks, W };
    viewRef.current = { t0: 0, t1: 0 };
    force(x => x + 1);
  }, [buffer]);

  const view = () => {
    const v = viewRef.current;
    return (v.t1 > v.t0) ? v : { t0: 0, t1: duration || 1 };
  };

  const segColor = (s, i) => {
    if (s.group) {
      const gi = s.group.charCodeAt(0) - 65;
      return SEG_COLORS[gi % SEG_COLORS.length];
    }
    return SEG_COLORS[i % SEG_COLORS.length];
  };

  const draw = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = rect.width;
    const TC = themeColors();
    ctx.fillStyle = TC.waveBg; ctx.fillRect(0, 0, W, H);
    if (!duration) return;
    const { t0, t1 } = view();
    const span = t1 - t0;
    const tx = tt => ((tt - t0) / span) * W;

    // segment backgrounds
    segments.forEach((s, i) => {
      if (s.end < t0 || s.start > t1) return;
      const c = segColor(s, i);
      ctx.fillStyle = c + (i === playingSeg ? '40' : '1c');
      ctx.fillRect(tx(s.start), 0, tx(s.end) - tx(s.start), H);
      // build-up (no loop): diagonal hatching
      if (s.loop === false) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(tx(s.start), 0, tx(s.end) - tx(s.start), H);
        ctx.clip();
        ctx.strokeStyle = '#ffffff14';
        ctx.beginPath();
        const step = 14;
        for (let x = tx(s.start) - H; x < tx(s.end); x += step) {
          ctx.moveTo(x, H); ctx.lineTo(x + H, 0);
        }
        ctx.stroke();
        ctx.restore();
      }
      // loopStart: yellow marker inside the part
      if (s.loop !== false && s.loopStart != null && s.loopStart > s.start + 0.05) {
        const lx = tx(s.loopStart);
        ctx.strokeStyle = '#ffb84f';
        ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, H); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#ffb84f';
        ctx.beginPath();
        ctx.moveTo(lx, 14); ctx.lineTo(lx + 8, 19); ctx.lineTo(lx, 24); ctx.fill();
      }
    });

    // beats / downbeats (beats are drawn only at sufficient zoom)
    if (beats && span < duration * 0.6) {
      ctx.strokeStyle = TC.bar; ctx.beginPath();
      for (const b of beats) { if (b < t0 || b > t1) continue; ctx.moveTo(tx(b), H - 14); ctx.lineTo(tx(b), H); }
      ctx.stroke();
    }
    if (downbeats) {
      ctx.strokeStyle = TC.downbeat; ctx.beginPath();
      for (const b of downbeats) { if (b < t0 || b > t1) continue; ctx.moveTo(tx(b), H - 26); ctx.lineTo(tx(b), H); }
      ctx.stroke();
      // every 4 bars — a taller, more visible phrase tick + group number
      ctx.strokeStyle = TC.phrase; ctx.beginPath();
      for (let i = 0; i < downbeats.length; i += 4) {
        const b = downbeats[i];
        if (b < t0 || b > t1) continue;
        ctx.moveTo(tx(b), H - 44); ctx.lineTo(tx(b), H);
      }
      ctx.stroke();
      // bar numbering: on the overview — every 4th (phrase number), when
      // zoomed — every bar (its number); the stride is picked by pixel density
      const barPx = ((downbeats[1] || duration) - (downbeats[0] || 0)) / span * W;
      let stride = 0;
      if (barPx >= 22) stride = 1;        // strong zoom: every bar
      else if (barPx * 4 >= 26) stride = 4; // overview: every 4 bars
      if (stride) {
        ctx.fillStyle = TC.phrase;
        ctx.font = (stride === 1 ? '10px' : '9px') + ' "JetBrains Mono", monospace';
        for (let i = 0; i < downbeats.length; i += stride) {
          const b = downbeats[i];
          if (b < t0 || b > t1) continue;
          ctx.fillText(String(stride === 1 ? i + 1 : i / 4 + 1), tx(b) + 3, H - 34);
        }
      }
    }

    // waveform
    if (peaksRef.current) {
      const { peaks, W: PW } = peaksRef.current;
      ctx.strokeStyle = TC.waveLine; ctx.globalAlpha = 0.7;
      ctx.beginPath();
      const mid = H / 2, amp = H / 2 - 10;
      for (let x = 0; x < W; x++) {
        const tt = t0 + (x / W) * span;
        const pi = Math.min(PW - 1, Math.floor((tt / duration) * PW));
        ctx.moveTo(x + .5, mid + peaks[pi * 2] * amp);
        ctx.lineTo(x + .5, mid + peaks[pi * 2 + 1] * amp);
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    }

    // boundaries
    segments.forEach((s, i) => {
      if (i === 0 || s.start < t0 || s.start > t1) return;
      const x = tx(s.start);
      ctx.strokeStyle = TC.bound; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      ctx.lineWidth = 1;
      ctx.fillStyle = TC.bound;
      ctx.beginPath();
      ctx.moveTo(x - 5, 0); ctx.lineTo(x + 5, 0); ctx.lineTo(x, 8); ctx.fill();
    });

    // labels + loop quality
    segments.forEach((s, i) => {
      if (s.end < t0 || s.start > t1) return;
      const c = segColor(s, i);
      ctx.fillStyle = c;
      ctx.font = '600 11px Manrope, sans-serif';
      const lx = Math.max(tx(s.start) + 6, 6);
      ctx.fillText(s.label, lx, 15);
      if (s.loopability != null) {
        const q = s.loopability;
        ctx.fillStyle = q > 0.75 ? TC.accent2 : q > 0.55 ? '#ffb84f' : TC.danger;
        ctx.font = '600 10px "JetBrains Mono", monospace';
        ctx.fillText('\u27F3' + Math.round(q * 100) + '%', lx, 28);
      }
      // stinger icon on the part's left boundary (the sound plays on entry)
      if (s.stinger && s.stinger !== 'none' && s.start >= t0) {
        const sx = tx(s.start);
        ctx.fillStyle = TC.playhead;
        ctx.font = '11px sans-serif';
        ctx.fillText('\u266A', sx + 3, H - 34);
        const glyph = s.stinger === 'cymbal' ? '\u2735'
          : s.stinger === 'boom' ? '\u25CF' : '\u2197';
        ctx.font = '9px sans-serif';
        ctx.fillText(glyph, sx + 14, H - 34);
      }
    });

    // scrollbar when zoomed: track + draggable thumb
    if (span < duration * 0.999) {
      const SB_H = 12;
      ctx.fillStyle = TC.bar;
      ctx.fillRect(0, H - SB_H, W, SB_H);
      const bx = (t0 / duration) * W;
      const bw = Math.max(24, (span / duration) * W);
      const hover = dragRef.current && dragRef.current.type === 'scroll';
      ctx.fillStyle = hover ? '#8aa8ff' : '#6a8dff';
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(bx, H - SB_H + 2, bw, SB_H - 4, 4);
        ctx.fill();
      } else {
        ctx.fillRect(bx, H - SB_H + 2, bw, SB_H - 4);
      }
      // notches on the thumb
      ctx.strokeStyle = '#0a0d14aa';
      ctx.beginPath();
      const cxm = bx + bw / 2;
      for (const dx of [-4, 0, 4]) {
        ctx.moveTo(cxm + dx, H - SB_H + 4);
        ctx.lineTo(cxm + dx, H - 4);
      }
      ctx.stroke();
    }

    // playhead (or the position picked before playback / while dragging)
    let pos = dragRef.current && dragRef.current.type === 'playhead'
      ? dragRef.current.pos
      : (player && player.position());
    if (pos == null && player && player.pendingPos != null) pos = player.pendingPos;
    if (pos != null && pos >= t0 && pos <= t1) {
      const x = tx(pos);
      const grad = ctx.createLinearGradient(x - 8, 0, x + 8, 0);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(.5, TC.phrase);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad; ctx.fillRect(x - 8, 0, 16, H);
      ctx.strokeStyle = TC.playhead; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      // playhead handle
      ctx.fillStyle = TC.playhead;
      ctx.beginPath(); ctx.arc(x, 6, 5, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 1;
    }
  }, [segments, beats, downbeats, duration, playingSeg, player]);

  useEffect(() => {
    let raf;
    const loop = () => { draw(); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [draw]);

  const timeAt = e => {
    const rect = canvasRef.current.getBoundingClientRect();
    const { t0, t1 } = view();
    const tt = t0 + ((e.clientX - rect.left) / rect.width) * (t1 - t0);
    return Math.max(0, Math.min(duration, tt));
  };
  const tolTime = () => {
    const rect = canvasRef.current.getBoundingClientRect();
    const { t0, t1 } = view();
    return (8 / rect.width) * (t1 - t0);
  };
  const snapTime = tt => {
    if (!snap || !downbeats || !downbeats.length) return tt;
    let best = tt, bd = Infinity;
    for (const b of downbeats) { const d = Math.abs(b - tt); if (d < bd) { bd = d; best = b; } }
    const { t0, t1 } = view();
    return bd < (t1 - t0) * 0.01 + 0.35 ? best : tt;
  };

  // wheel: zoom to the cursor; shift+wheel / horizontal scroll: pan
  const onWheel = e => {
    if (!duration) return;
    e.preventDefault();
    const { t0, t1 } = view();
    const span = t1 - t0;
    if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
      const dt = (e.deltaX || e.deltaY) / 500 * span;
      let n0 = t0 + dt, n1 = t1 + dt;
      if (n0 < 0) { n1 -= n0; n0 = 0; }
      if (n1 > duration) { n0 -= n1 - duration; n1 = duration; }
      viewRef.current = { t0: Math.max(0, n0), t1: Math.min(duration, n1) };
      return;
    }
    const cursor = timeAt(e);
    const factor = e.deltaY > 0 ? 1.25 : 0.8;
    let ns = Math.min(duration, Math.max(2, span * factor));
    const ratio = (cursor - t0) / span;
    let n0 = cursor - ns * ratio, n1 = n0 + ns;
    if (n0 < 0) { n1 -= n0; n0 = 0; }
    if (n1 > duration) { n0 -= n1 - duration; n1 = duration; }
    viewRef.current = ns >= duration ? { t0: 0, t1: 0 } : { t0: Math.max(0, n0), t1: n1 };
  };

  const onMouseDown = e => {
    if (!duration) return;
    const tt = timeAt(e);
    const tolT = tolTime();
    // 0) scrollbar (bottom 12px when zoomed)
    {
      const rect = canvasRef.current.getBoundingClientRect();
      const my = e.clientY - rect.top;
      const { t0, t1 } = view();
      const span = t1 - t0;
      if (span < duration * 0.999 && my > H - 14) {
        const W = rect.width;
        const bx = (t0 / duration) * W;
        const bw = Math.max(24, (span / duration) * W);
        const mx = e.clientX - rect.left;
        if (mx >= bx && mx <= bx + bw) {
          // drag the thumb
          dragRef.current = { type: 'scroll', grabDx: mx - bx, span };
        } else {
          // click on the track — jump the window and start dragging right away
          let n0 = (mx / W) * duration - span / 2;
          n0 = Math.max(0, Math.min(duration - span, n0));
          viewRef.current = { t0: n0, t1: n0 + span };
          dragRef.current = { type: 'scroll', grabDx: bw / 2, span };
        }
        e.preventDefault();
        return;
      }
    }
    // 1) playhead — priority
    const pos = (player && player.position()) ?? (player && player.pendingPos);
    if (pos != null && Math.abs(pos - tt) < tolT) {
      dragRef.current = { type: 'playhead', pos };
      e.preventDefault();
      return;
    }
    // 2) loopStart marker
    for (let i = 0; i < segments.length; i++) {
      const s = segments[i];
      if (s.loop !== false && s.loopStart != null
          && Math.abs(s.loopStart - tt) < tolT) {
        dragRef.current = { type: 'loopstart', idx: i };
        if (beginEdit) beginEdit();
        e.preventDefault();
        return;
      }
    }
    // 3) segment boundaries
    for (let i = 1; i < segments.length; i++) {
      if (Math.abs(segments[i].start - tt) < tolT) {
        dragRef.current = { type: 'bound', idx: i };
        if (beginEdit) beginEdit();
        e.preventDefault();
        return;
      }
    }
    // 4) Alt+click inside a part — set loopStart at that point
    if (e.altKey) {
      const i = segments.findIndex(s => tt > s.start + 0.3 && tt < s.end - 0.3);
      if (i >= 0) {
        const nt = snapTime(tt);
        setSegments(segs => {
          const ns = segs.map(s => ({ ...s }));
          ns[i].loopStart = Math.max(ns[i].start + 0.3, Math.min(ns[i].end - 0.5, nt));
          return ns;
        });
        return;
      }
    }
    // 5) click on empty space — seek to that point
    player.seek(tt);
  };
  const onMouseMove = e => {
    const canvas = canvasRef.current;
    if (!canvas || !duration) return;
    const tt = timeAt(e);
    const d = dragRef.current;
    if (d && d.type === 'scroll') {
      const rect = canvas.getBoundingClientRect();
      const W = rect.width;
      const mx = e.clientX - rect.left;
      const span = d.span;
      let n0 = ((mx - d.grabDx) / W) * duration;
      n0 = Math.max(0, Math.min(duration - span, n0));
      viewRef.current = { t0: n0, t1: n0 + span };
      return;
    }
    if (d && d.type === 'playhead') {
      d.pos = Math.max(0, Math.min(duration - 0.05, tt));
      return;
    }
    if (d && d.type === 'loopstart') {
      const i = d.idx;
      const s = segments[i];
      const nt = Math.max(s.start + 0.3, Math.min(s.end - 0.5, snapTime(tt)));
      setSegments(segs => {
        const ns = segs.map(x => ({ ...x }));
        ns[i].loopStart = nt;
        return ns;
      }, true);
      return;
    }
    if (d && d.type === 'bound') {
      const i = d.idx;
      const lo = segments[i - 1].start + 0.5;
      const hi = segments[i].end - 0.5;
      const nt = Math.max(lo, Math.min(hi, snapTime(tt)));
      setSegments(segs => {
        const ns = segs.map(s => ({ ...s }));
        ns[i - 1].end = nt; ns[i].start = nt;
        return ns;
      }, true);
      return;
    }
    const tolT = tolTime();
    const rect2 = canvas.getBoundingClientRect();
    const my2 = e.clientY - rect2.top;
    const v2 = view();
    const onScrollbar = (v2.t1 - v2.t0) < duration * 0.999 && my2 > H - 14;
    const pos = (player && player.position()) ?? (player && player.pendingPos);
    const onPlayhead = pos != null && Math.abs(pos - tt) < tolT;
    const onLoopStart = segments.some(s => s.loop !== false && s.loopStart != null
                                      && Math.abs(s.loopStart - tt) < tolT);
    const nearBound = segments.some((s, i) => i > 0 && Math.abs(s.start - tt) < tolT);
    canvas.style.cursor = onScrollbar ? 'grab' : onPlayhead ? 'grab'
      : (onLoopStart || nearBound) ? 'ew-resize' : 'pointer';
  };
  const onMouseUp = () => {
    const d = dragRef.current;
    dragRef.current = null;
    if (d && d.type === 'playhead') player.seek(d.pos);
    if (d && (d.type === 'bound' || d.type === 'loopstart') && commitEdit) commitEdit();
  };
  const onDblClick = e => {
    const tt = snapTime(timeAt(e));
    setSegments(segs => {
      const i = segs.findIndex(s => tt > s.start + 0.5 && tt < s.end - 0.5);
      if (i < 0) return segs;
      const ns = segs.map(s => ({ ...s }));
      const right = { start: tt, end: ns[i].end, label: ns[i].label + '·2' };
      ns[i] = { ...ns[i], end: tt };
      ns.splice(i + 1, 0, right);
      return ns;
    });
  };

  useEffect(() => {
    window.addEventListener('mouseup', onMouseUp);
    const cv = canvasRef.current;
    if (cv) cv.addEventListener('wheel', onWheel, { passive: false });
    return () => {
      window.removeEventListener('mouseup', onMouseUp);
      if (cv) cv.removeEventListener('wheel', onWheel);
    };
  }, [duration, segments]);

  return (
    <div className="canvas-wrap">
      <canvas ref={canvasRef} style={{ height: H }}
        onMouseDown={onMouseDown} onMouseMove={onMouseMove} onDoubleClick={onDblClick} />
      {aiWorking && <AiOverlay t={t} />}
      <div className="hint">{t.wave_hint}</div>
    </div>
  );
}

// AI-processing overlay: scanning stripe + rotating stages
function AiOverlay({ t }) {
  const stages = [t.ai_stage1, t.ai_stage2, t.ai_stage3, t.ai_stage4];
  const [idx, setIdx] = useState(0);
  useEffect(() => {
    // approximate stage durations (sec) on the first run
    const timers = [
      setTimeout(() => setIdx(1), 8000),
      setTimeout(() => setIdx(2), 45000),
      setTimeout(() => setIdx(3), 70000),
    ];
    return () => timers.forEach(clearTimeout);
  }, []);
  return (
    <div className="ai-overlay">
      <div className="scanline"></div>
      <div className="ai-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div className="ai-title">✨ {t.ai_working}</div>
      <div className="ai-stage">{stages[idx]}</div>
    </div>
  );
}

// ================================ App ======================================
function App() {
  const [lang, setLang] = useState(() => {
    const saved = localStorage.getItem('musslop_lang');
    return STR[saved] ? saved : 'en';
  });
  const t = STR[lang];
  const setLanguage = l => { setLang(l); localStorage.setItem('musslop_lang', l); document.documentElement.lang = l; };

  // --- UI theme --------------------------------------------------------------
  const [theme, setThemeState] = useState(() => {
    const t0 = localStorage.getItem('musslop_theme');
    return (t0 === 'tavern' || t0 === 'mono') ? t0 : 'mono';
  });
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('musslop_theme', theme);
  }, [theme]);

  const [trackId, setTrackId] = useState(null);
  const [trackName, setTrackName] = useState('');
  const [loading, setLoading] = useState(null);
  const [error, setError] = useState(null);
  const [analysis, setAnalysis] = useState(null);
  const [segments, setSegmentsRaw] = useState([]);

  // --- Undo (Ctrl+Z): segment change history -------------------------
  const historyRef = useRef([]);       // stack of past states
  const dragSnapRef = useRef(null);    // snapshot before a drag series starts
  // regular change: snapshot into history; silent=true — no record (drag)
  const setSegments = useCallback((updater, silent = false) => {
    setSegmentsRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      if (!silent && next !== prev) {
        historyRef.current.push(prev);
        if (historyRef.current.length > 100) historyRef.current.shift();
      }
      return next;
    });
  }, []);
  // drag series: one undo step for the entire drag
  const beginEdit = useCallback(() => {
    setSegmentsRaw(prev => { dragSnapRef.current = prev; return prev; });
  }, []);
  const commitEdit = useCallback(() => {
    const snap0 = dragSnapRef.current;
    dragSnapRef.current = null;
    if (snap0 == null) return;
    setSegmentsRaw(prev => {
      if (prev !== snap0) {
        historyRef.current.push(snap0);
        if (historyRef.current.length > 100) historyRef.current.shift();
      }
      return prev;
    });
  }, []);
  const undo = useCallback(() => {
    const prev = historyRef.current.pop();
    if (prev) setSegmentsRaw(prev);
  }, []);
  const [buffer, setBuffer] = useState(null);
  const [snap, setSnap] = useState(true);
  const [nSeg, setNSeg] = useState('');
  const [aiWorking, setAiWorking] = useState(false);   // AI analysis in progress
  const [exportOpen, setExportOpen] = useState(false);
  const [openGroups, setOpenGroups] = useState({ lib: true, hist: false });
  const [stingerMenu, setStingerMenu] = useState(null); // index of the part with the stinger menu open
  const [tailOn, setTailOn] = useState(true);
  const [bassSwapOn, setBassSwapOn] = useState(true);
  const [volume, setVolumeState] = useState(() => {
    const v = parseFloat(localStorage.getItem('musslop_volume'));
    // don't restore a saved mute (0): after a page reload a
    // "silent" player looks like broken audio
    return isFinite(v) && v > 0.02 ? v : 1;
  });
  const setVolume = v => {
    setVolumeState(v);
    localStorage.setItem('musslop_volume', String(v));
    if (playerRef.current) playerRef.current.setVolume(v);
  };
  const [deepAvailable, setDeepAvailable] = useState(false);
  const [songformerAvailable, setSongformerAvailable] = useState(false);
  useEffect(() => {
    fetch('/api/health').then(r => r.json())
      .then(h => {
        setDeepAvailable(!!h.deep_available);
        setSongformerAvailable(!!h.songformer_available);
      }).catch(() => {});
  }, []);
  const [dragOver, setDragOver] = useState(false);
  const [pendingMarkupFile, setPendingMarkupFile] = useState(null);
  const [rate, setRateState] = useState(1);
  const [crossfade, setCrossfade] = useState(0);       // sec
  const [transMode, setTransMode] = useState('loop');  // 'loop' | 'phrase'
  const [phraseBars, setPhraseBars] = useState(4);     // 4 or 8 bars
  const [, force] = useState(0);
  const playerRef = useRef(null);
  const fileRef = useRef(null);
  const markupRef = useRef(null);
  const loopQT = useRef(null);

  if (!playerRef.current) {
    playerRef.current = new LoopPlayer();
    playerRef.current.volume = volume;
  }
  const player = playerRef.current;
  useEffect(() => { player.onState = () => force(x => x + 1); }, []);
  // stingers: download right away (bytes), decode lazily — on first
  // playback. Do NOT create an AudioContext without a user gesture:
  // an auto-created suspended context breaks audio in some browsers.
  const stingerRaw = useRef({});
  useEffect(() => {
    (async () => {
      for (const name of ['cymbal', 'boom', 'riser']) {
        try {
          stingerRaw.current[name] = await (await fetch(`stingers/${name}.wav`)).arrayBuffer();
        } catch (e) {}
      }
    })();
  }, []);
  useEffect(() => {
    player.loadStingers = async () => {
      if (!player.ctx) return;
      for (const [name, ab] of Object.entries(stingerRaw.current)) {
        if (!player.stingerBuffers[name] && ab) {
          try { player.stingerBuffers[name] = await player.decode(ab.slice(0)); }
          catch (e) {}
        }
      }
    };
  }, []);
  // track change -> old track's stems are stale
  useEffect(() => {
    player.stems = null;
    player.stemGains = null;
    setStemsState('none');
  }, [trackId]);
  useEffect(() => { player.setSegments(segments); }, [segments]);
  useEffect(() => { player.crossfade = crossfade; }, [crossfade]);
  useEffect(() => { player.transitionMode = transMode; }, [transMode]);
  useEffect(() => { player.phraseBars = phraseBars; }, [phraseBars]);
  useEffect(() => {
    if (analysis) player.downbeats = analysis.downbeats || [];
  }, [analysis]);
  useEffect(() => () => player.stop(false), []);

  // recompute loop quality after manual editing (debounce 800ms)
  useEffect(() => {
    if (!trackId || !segments.length) return;
    clearTimeout(loopQT.current);
    loopQT.current = setTimeout(async () => {
      try {
        const r = await fetch(`/api/loopability/${trackId}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(segments.map(s => ({ start: s.start, end: s.end }))),
        });
        if (!r.ok) return;
        const { loopability } = await r.json();
        setSegments(segs => segs.length === loopability.length
          ? segs.map((s, i) => ({ ...s, loopability: loopability[i] })) : segs);
      } catch (e) {}
    }, 800);
    return () => clearTimeout(loopQT.current);
  }, [trackId, segments.map(s => `${s.start.toFixed(2)}_${s.end.toFixed(2)}`).join('|')]);

  // --- Stems (vertical layering) -------------------------------------------
  const [stemsState, setStemsState] = useState('none'); // none|loading|ready
  const defaultLayers = () => ({
    drums: { on: true, vol: 1 }, bass: { on: true, vol: 1 },
    other: { on: true, vol: 1 }, vocals: { on: true, vol: 1 },
  });
  const [layers, setLayersState] = useState(defaultLayers);
  const updateLayer = (name, patch) => {
    setLayersState(prev => {
      const next = { ...prev, [name]: { ...prev[name], ...patch } };
      player.setLayers(next);
      return next;
    });
  };
  const loadStems = async () => {
    if (!trackId || stemsState === 'loading') return;
    setError(null);
    setStemsState('loading');
    setLoading(t.stems_loading);
    try {
      const r = await fetch(`/api/stems/${trackId}`, { method: 'POST' });
      if (!r.ok) throw new Error((await r.json()).detail || t.err_analyze);
      // poll the background task with percentages
      while (true) {
        const st = await (await fetch(`/api/stems/${trackId}/status`)).json();
        if (st.status === 'done') break;
        if (st.status === 'error') throw new Error(st.error || t.err_analyze);
        if (st.status === 'none') throw new Error(t.err_analyze);
        setLoading(`${t.stems_loading_pct} ${st.progress || 0}%`);
        await new Promise(res => setTimeout(res, 1500));
      }
      player._ensureCtx();
      const names = ['drums', 'bass', 'other', 'vocals'];
      const bufs = {};
      for (let i = 0; i < names.length; i++) {
        setLoading(`${t.stems_downloading} ${i + 1}/4…`);
        const ab = await (await fetch(`/api/stems/${trackId}/${names[i]}`)).arrayBuffer();
        bufs[names[i]] = await player.decode(ab);
      }
      player.stems = bufs;
      player.stemGains = null; // recreate with the current intensity
      setStemsState('ready');
      // restart playback on the stems from the current position
      if (player.playing) {
        const pos = player.position();
        if (pos != null) player._softRestartAt(pos);
      }
    } catch (e) {
      setError(String(e.message || e));
      setStemsState('none');
    } finally {
      setLoading(null);
    }
  };
  const unloadStems = () => {
    player.stems = null;
    player.stemGains = null;
    setStemsState('none');
    if (player.playing) {
      const pos = player.position();
      if (pos != null) player._softRestartAt(pos);
    }
  };

  // --- Import from URL --------------------------------------------------------
  const [importUrl, setImportUrl] = useState('');
  const importFromUrl = async () => {
    const url = importUrl.trim();
    if (!url) return;
    setError(null);
    setLoading(t.url_downloading);
    try {
      const r = await fetch('/api/import_url', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      if (!r.ok) throw new Error((await r.json()).detail || t.err_upload);
      const { track_id, name } = await r.json();
      setImportUrl('');
      loadHistory();
      await openFromHistory({ track_id, name });
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setLoading(null);
    }
  };

  const exportLoops = async () => {
    if (!trackId) return;
    setError(null);
    setLoading(t.exporting);
    try {
      const r = await fetch(`/api/export/${trackId}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(segments.map(s => ({ start: s.start, end: s.end, label: s.label }))),
      });
      if (!r.ok) throw new Error(t.err_export);
      // download with progress (the zip can be large — full-quality WAV)
      const total = +r.headers.get('Content-Length') || 0;
      const reader = r.body.getReader();
      const chunks = []; let got = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value); got += value.length;
        setLoading(total
          ? `${t.export_downloading} ${Math.round(got / total * 100)}% (${(got / 1048576).toFixed(0)} MB)`
          : `${t.export_downloading} ${(got / 1048576).toFixed(0)} MB`);
      }
      const blob = new Blob(chunks, { type: 'application/zip' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (trackName || 'track').replace(/\.[^.]+$/, '') + '_loops.zip';
      a.click();
      URL.revokeObjectURL(a.href);
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setLoading(null);
    }
  };

  const exportMarkup = () => {
    const data = { track: trackName, tempo: analysis && analysis.tempo, segments };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (trackName || 'markup').replace(/\.[^.]+$/, '') + '.musslop.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const importMarkup = async file => {
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.segments) || !data.segments.length) throw new Error('no segments');
      const segs = data.segments
        .map(s => ({ start: +s.start, end: +s.end, label: String(s.label || ''),
                     loop: s.loop !== false,
                     transition: !!s.transition,
                     loopStart: isFinite(+s.loopStart) ? +s.loopStart : undefined,
                     stinger: ['cymbal','boom','riser'].includes(s.stinger) ? s.stinger : undefined }))
        .filter(s => isFinite(s.start) && isFinite(s.end) && s.end > s.start)
        .sort((a, b) => a.start - b.start);
      if (!segs.length) throw new Error('empty markup');
      setSegments(segs);
      setError(null);
    } catch (e) {
      setError(t.err_markup + ' ' + e.message);
    } finally {
      if (markupRef.current) markupRef.current.value = '';
    }
  };

  const upload = async file => {
    setError(null);
    player.stop();
    try {
      // The browser already has the file — decode it directly, without downloading
      // from the server. In parallel, send it to the server for structure analysis.
      setLoading(t.loading_decode);
      const fd = new FormData();
      fd.append('file', file);
      const uploadPromise = fetch('/api/upload', { method: 'POST', body: fd });

      const ab = await file.arrayBuffer();
      player._ensureCtx();
      let buf = null;
      try {
        buf = await player.decode(ab.slice(0));
      } catch (e) { buf = null; }

      setLoading(t.loading_upload);
      const r = await uploadPromise;
      if (!r.ok) throw new Error((await r.json()).detail || t.err_upload);
      const { track_id, name } = await r.json();
      setTrackId(track_id); setTrackName(name);

      // Server-side analysis is the source of truth for the duration
      const a = await doAnalyze(track_id, null);
      loadHistory();
      if (pendingMarkupFile) {
        const f = pendingMarkupFile;
        setPendingMarkupFile(null);
        await importMarkup(f);
      }

      // compare durations: browser decoders sometimes truncate
      // FLAC/m4a with embedded cover art — then take the WAV from the server
      const serverDur = a ? a.duration : null;
      const durOk = buf && serverDur != null
        && Math.abs(buf.duration - serverDur) < Math.max(1, serverDur * 0.02);
      if (buf && (serverDur == null || durOk)) {
        player.buffer = buf;
        setBuffer(buf);
      } else {
        setLoading(t.loading_transcode);
        const wavR = await fetch(`/api/audio/${track_id}?transcode=1`);
        if (!wavR.ok) throw new Error(t.err_upload);
        const wavAb = await wavR.arrayBuffer();
        const wavBuf = await player.decode(wavAb);
        player.buffer = wavBuf;
        setBuffer(wavBuf);
      }
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setLoading(null);
    }
  };

  // --- Track history --------------------------------------------------------
  const [history, setHistory] = useState([]);
  const loadHistory = useCallback(async () => {
    try {
      const r = await fetch('/api/tracks');
      if (r.ok) setHistory((await r.json()).tracks);
    } catch (e) {}
  }, []);
  useEffect(() => { loadHistory(); }, []);

  // autosave the markup to the server (debounce 1.2s)
  const saveT = useRef(null);
  useEffect(() => {
    if (!trackId || !analysis || !segments.length) return;
    clearTimeout(saveT.current);
    saveT.current = setTimeout(() => {
      fetch(`/api/markup/${trackId}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          duration: analysis.duration, tempo: analysis.tempo,
          beats: analysis.beats, downbeats: analysis.downbeats,
          n_suggested: analysis.n_suggested, n_max: analysis.n_max,
          segments,
        }),
      }).catch(() => {});
    }, 1200);
    return () => clearTimeout(saveT.current);
  }, [trackId, segments, analysis]);

  // open a track from history: audio from the server + saved markup
  const openFromHistory = async item => {
    setError(null);
    player.stop();
    try {
      setLoading(t.loading_history);
      const [audioR, markupR] = await Promise.all([
        fetch(`/api/audio/${item.track_id}`),
        fetch(`/api/markup/${item.track_id}`),
      ]);
      if (!audioR.ok) throw new Error(t.err_upload);
      const ab = await audioR.arrayBuffer();
      player._ensureCtx();
      let buf = null;
      try { buf = await player.decode(ab); } catch (e) { buf = null; }
      setTrackId(item.track_id); setTrackName(item.name);

      const markup = markupR.ok ? (await markupR.json()).markup : null;
      let serverDur = markup ? markup.duration : null;
      let analyzed = null;
      if (markup && Array.isArray(markup.segments) && markup.segments.length) {
        historyRef.current = [];
        setAnalysis({
          duration: markup.duration, tempo: markup.tempo || 0,
          beats: markup.beats || [], downbeats: markup.downbeats || [],
          n_suggested: markup.n_suggested, n_max: markup.n_max,
          segments: markup.segments, fallback: false,
        });
        setSegmentsRaw(markup.segments);
      } else {
        analyzed = await doAnalyze(item.track_id, null);
        if (analyzed) serverDur = analyzed.duration;
      }

      // the browser may have truncated the original (FLAC with cover art etc.)
      const durOk = buf && serverDur != null
        && Math.abs(buf.duration - serverDur) < Math.max(1, serverDur * 0.02);
      if (buf && (serverDur == null || durOk)) {
        player.buffer = buf;
        setBuffer(buf);
      } else {
        setLoading(t.loading_transcode);
        const wavR = await fetch(`/api/audio/${item.track_id}?transcode=1`);
        if (!wavR.ok) throw new Error(t.err_upload);
        const wavBuf = await player.decode(await wavR.arrayBuffer());
        player.buffer = wavBuf;
        setBuffer(wavBuf);
      }
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setLoading(null);
    }
  };

  const deleteFromHistory = async (e, item) => {
    e.stopPropagation();
    try {
      await fetch(`/api/tracks/${item.track_id}`, { method: 'DELETE' });
      loadHistory();
    } catch (er) {}
  };

  const toggleFavorite = async (e, item) => {
    if (e) e.stopPropagation();
    try {
      await fetch(`/api/favorite/${item.track_id}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ favorite: !item.favorite }),
      });
      loadHistory();
    } catch (er) {}
  };
  const currentFav = history.find(h => h.track_id === trackId);

  const [toast, setToast] = useState(null);
  const showToast = msg => {
    setToast(msg);
    setTimeout(() => setToast(null), 6000);
  };

  const doAnalyze = async (id, n, eng) => {
    setError(null);
    const useEngine = eng || 'fast';
    const isDeep = useEngine === 'deep' || useEngine === 'songformer';
    const prevCount = segments.length;
    setLoading(isDeep ? t.loading_deep : t.loading_analyze);
    if (isDeep) setAiWorking(true);
    try {
      const params = new URLSearchParams();
      if (n) params.set('n_segments', n);
      if (isDeep) params.set('engine', useEngine);
      const qs = params.toString();
      const r = await fetch(`/api/analyze/${id}${qs ? '?' + qs : ''}`);
      if (!r.ok) throw new Error((await r.json()).detail || t.err_analyze);
      const a = await r.json();
      setAnalysis(a);
      setSegments(a.segments);
      if (isDeep) {
        const labels = a.segments.slice(0, 5).map(s => s.label).join(', ')
          + (a.segments.length > 5 ? '…' : '');
        showToast(`✨ ${t.ai_done} ${prevCount || '—'} → ${a.segments.length}. ${labels}`);
      }
      return a;
    } catch (e) {
      setError(String(e.message || e));
      return null;
    } finally {
      setLoading(null);
      setAiWorking(false);
    }
  };

  // Универсальный приём файла: аудио / разметка / прочее — с защитой от
  // типовых ошибок использования
  const handleAnyFile = file => {
    const name = (file.name || '').toLowerCase();
    if (name.endsWith('.json')) {
      if (!analysis) {
        setError(t.err_markup_no_track);   // json без трека — понятная ошибка
        return;
      }
      importMarkup(file);
      return;
    }
    const audioExt = ['.mp3', '.wav', '.ogg', '.flac', '.m4a', '.aac', '.opus', '.webm'];
    if (audioExt.some(ext => name.endsWith(ext)) || (file.type || '').startsWith('audio/')) {
      if (file.size > 300 * 1024 * 1024) {
        setError(t.err_file_too_big);
        return;
      }
      upload(file);
      return;
    }
    setError(t.err_unknown_file + ' ' + (file.name || ''));
  };

  const onDropAny = e => {
    e.preventDefault(); setDragOver(false);
    const files = Array.from(e.dataTransfer.files || []);
    if (!files.length) return;
    if (files.length > 1) {
      // трек+разметка одним движением: сначала аудио, потом json
      const audio = files.find(f => !(f.name || '').toLowerCase().endsWith('.json'));
      const json = files.find(f => (f.name || '').toLowerCase().endsWith('.json'));
      if (audio && json) {
        setPendingMarkupFile(json);
        handleAnyFile(audio);
        return;
      }
    }
    handleAnyFile(files[0]);
  };

  // Файлы принимаются на ВСЁ окно: кинул трек на волну — заменил трек,
  // кинул json — применил разметку. Дроп-зоны остаются как подсказка.
  const onDropAnyRef = useRef(onDropAny);
  onDropAnyRef.current = onDropAny;
  useEffect(() => {
    const over = e => {
      if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {
        e.preventDefault();
        setDragOver(true);
      }
    };
    const leave = e => {
      // покидание окна (relatedTarget = null)
      if (!e.relatedTarget) setDragOver(false);
    };
    const drop = e => {
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
        onDropAnyRef.current(e);
      }
    };
    window.addEventListener('dragover', over);
    window.addEventListener('dragleave', leave);
    window.addEventListener('drop', drop);
    return () => {
      window.removeEventListener('dragover', over);
      window.removeEventListener('dragleave', leave);
      window.removeEventListener('drop', drop);
    };
  }, []);

  const removeSeg = i => {
    if (segments.length <= 1) return;
    setSegments(segs => {
      const ns = segs.map(s => ({ ...s }));
      if (i === 0) { ns[1].start = ns[0].start; }
      else { ns[i - 1].end = ns[i].end; }
      ns.splice(i, 1);
      return ns;
    });
  };

  // Split a part at point pos (sec); snapped to the nearest downbeat
  const splitAt = pos => {
    if (pos == null || !analysis) return;
    let tt = pos;
    const dbs = analysis.downbeats || [];
    if (dbs.length) {
      let best = tt, bd = Infinity;
      for (const b of dbs) { const d = Math.abs(b - tt); if (d < bd) { bd = d; best = b; } }
      if (bd < 2.5) tt = best;
    }
    setSegments(segs => {
      const i = segs.findIndex(s => tt > s.start + 0.5 && tt < s.end - 0.5);
      if (i < 0) return segs;
      const ns = segs.map(s => ({ ...s }));
      const right = { start: tt, end: ns[i].end, label: ns[i].label + '·2' };
      ns[i] = { ...ns[i], end: tt };
      ns.splice(i + 1, 0, right);
      return ns;
    });
  };

  // Split at the current position (playing / picked by click), otherwise — the middle of the selected part
  const splitAtPlayhead = () => {
    let pos = player.position();
    if (pos == null) pos = player.pendingPos;
    if (pos == null && segments[player.segIndex]) {
      const s = segments[player.segIndex];
      pos = (s.start + s.end) / 2;
    }
    splitAt(pos);
  };

  // Split a specific part in half (at the bar nearest to the middle)
  const splitSeg = i => {
    const s = segments[i];
    if (!s) return;
    splitAt((s.start + s.end) / 2);
  };

  const playingSeg = player.playing ? player.segIndex : -1;
  const duration = analysis ? analysis.duration : 0;

  const splitRef = useRef(splitAtPlayhead);
  splitRef.current = splitAtPlayhead;

  useEffect(() => {
    const h = e => {
      if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') {
        e.preventDefault(); undo(); return;
      }
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') { e.preventDefault(); player.playing ? player.stop() : player.play(); }
      if (e.code === 'ArrowRight' || e.code === 'Enter') { e.preventDefault(); player.advance(); }
      if (e.code === 'KeyS') { e.preventDefault(); splitRef.current(); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  return (
    <div>
      <header>
        <div className="logo">
          <h1>{theme === 'tavern' ? 'Musslop' : 'musslop'}</h1>
          <div className="sub">{t.tagline}</div>
        </div>
        <div className="row" style={{ gap: 0 }}>
          <div className="theme-switch">
            <button className={theme === 'mono' ? 'on' : ''} title={t.theme_mono}
              onClick={() => setThemeState('mono')}>▪</button>
            <button className={theme === 'tavern' ? 'on' : ''} title={t.theme_tavern}
              onClick={() => setThemeState('tavern')}>⚔</button>
          </div>
          <div className="lang-switch">
            <button className={lang === 'ru' ? 'on' : ''} onClick={() => setLanguage('ru')}>RU</button>
            <button className={lang === 'en' ? 'on' : ''} onClick={() => setLanguage('en')}>EN</button>
            <button className={lang === 'zh' ? 'on' : ''} onClick={() => setLanguage('zh')}>中文</button>
          </div>
        </div>
      </header>

      <div className="panel">
        <div className="panel-title">{t.upload_title}</div>
        {/* Единая дроп-зона: принимает и аудио, и *.musslop.json; сворачивается
            в компактную строку, когда трек уже загружен */}
        {!analysis ? (
          <div className={'dropzone' + (dragOver ? ' over' : '')}
            onClick={() => fileRef.current.click()}
            onDragOver={e => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={onDropAny}>
            <span className="dz-icon">♫</span>
            <span>{t.drop_hint}<br />
              <span style={{ fontSize: 12, opacity: .7 }}>{t.drop_formats} · *.musslop.json</span></span>
          </div>
        ) : (
          <div className={'dz-compact' + (dragOver ? ' over' : '')}
            onClick={() => fileRef.current.click()}
            onDragOver={e => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={onDropAny}>
            <span>♫ <b>{trackName}</b></span>
            <span className="dz-compact-hint">{t.drop_compact_hint}</span>
          </div>
        )}
        <input ref={fileRef} type="file" accept="audio/*,.json" style={{ display: 'none' }}
          onChange={e => e.target.files[0] && handleAnyFile(e.target.files[0])} />
        <div className="row" style={{ marginTop: 10 }}>
          <input type="text" placeholder={t.url_placeholder} value={importUrl}
            onChange={e => setImportUrl(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && importFromUrl()}
            style={{ flex: 1, minWidth: 200, background: 'var(--panel2)', color: 'var(--text)',
                     border: '1px solid var(--border)', borderRadius: 10, padding: '9px 12px',
                     fontSize: 13.5, fontFamily: 'inherit', outline: 'none' }} />
          <button onClick={importFromUrl} disabled={!importUrl.trim() || !!loading}>
            🔗 {t.url_btn}
          </button>
        </div>
        {loading && <div className="status" style={{ marginTop: 12 }}><div className="spinner"></div>{loading}</div>}
        {error && <div className="error-box">
          <span className="x" style={{ float: 'right', marginLeft: 10, cursor: 'pointer' }}
            onClick={() => setError(null)}>✕</span>
          {t.err_prefix} {error}
        </div>}
        {history.length > 0 && <div style={{ marginTop: 14 }}>
          {[
            { key: 'lib', title: t.library_title, items: history.filter(h => h.favorite) },
            { key: 'hist', title: t.history_title, items: history.filter(h => !h.favorite) },
          ].map(group => group.items.length > 0 && (
            <div key={group.key} style={{ marginBottom: 6 }}>
              <div className="collapse-head"
                onClick={() => setOpenGroups(o => ({ ...o, [group.key]: !o[group.key] }))}>
                <span className={'caret' + (openGroups[group.key] ? ' open' : '')}>▶</span>
                <div className="panel-title" style={{ marginBottom: 0 }}>{group.title}</div>
                <span className="count">({group.items.length})</span>
              </div>
              {openGroups[group.key] && <div className="seg-list" style={{ marginTop: 6 }}>
                {group.items.map(item => (
                  <div key={item.track_id}
                    className={'seg-chip' + (item.track_id === trackId ? ' active' : '')}
                    onClick={() => openFromHistory(item)}
                    title={t.history_open_tip}>
                    <span className="x" style={{ color: item.favorite ? '#ffb84f' : 'var(--muted)', fontSize: 14 }}
                      title={item.favorite ? t.fav_remove_tip : t.fav_add_tip}
                      onClick={e => toggleFavorite(e, item)}>{item.favorite ? '★' : '☆'}</span>
                    <span style={{ fontSize: 13 }}>{item.has_markup ? '💾' : '♫'}</span>
                    <span style={{ fontWeight: 600, maxWidth: 220, overflow: 'hidden',
                                   textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{item.name}</span>
                    {item.duration != null && <span className="time">{fmt(item.duration)}</span>}
                    {item.n_segments > 0 && <span className="time">{item.n_segments} {t.history_parts}</span>}
                    <span className="x" title={t.history_del_tip}
                      onClick={e => deleteFromHistory(e, item)}>✕</span>
                  </div>
                ))}
              </div>}
            </div>
          ))}
        </div>}
      </div>

      {analysis && <div className="panel">
        <div className="panel-title">{t.structure_title}</div>

        {/* row 1: metrics + analysis */}
        <div className="row between" style={{ marginBottom: 10 }}>
          <div className="row">
            <span className="badge">{t.tempo} <b>{analysis.tempo.toFixed(1)} BPM</b></span>
            <span className="badge">{t.duration} <b>{fmt(duration)}</b></span>
            <span className="badge">{t.parts} <b>{segments.length}</b>
              {analysis.n_suggested != null && <span style={{ marginLeft: 6 }}>
                · {t.n_suggested} <b>{analysis.n_suggested}</b> · {t.n_max} <b>{analysis.n_max}</b></span>}
            </span>
            {(analysis.engine === 'deep' || analysis.engine === 'songformer') &&
              <span className="badge tip" data-tip={t.ai_badge_tip}
                style={{ color: 'var(--accent)', borderColor: 'var(--accent)' }}>
                {analysis.engine === 'deep' ? '✨ All-In-One' : '⚡ SongFormer'}</span>}
            {analysis.fallback && <span className="badge" style={{ color: 'var(--danger)' }}>{t.fallback}</span>}
          </div>
          <div className="row">
            <input type="number" min="2" max="24" placeholder={t.n_parts_ph}
              value={nSeg} onChange={e => setNSeg(e.target.value)} title={t.n_parts_tip} />
            <button onClick={() => doAnalyze(trackId, nSeg ? +nSeg : null)} disabled={!!loading}>
              {t.reanalyze}
            </button>
            {deepAvailable && <button className="ai-btn tip" data-tip={t.engine_tip}
              onClick={() => doAnalyze(trackId, null, 'deep')} disabled={!!loading}>
              ✨ {t.ai_split_btn}
            </button>}
            {songformerAvailable && <button className="ai-btn tip" data-tip={t.songformer_tip}
              onClick={() => doAnalyze(trackId, null, 'songformer')} disabled={!!loading}>
              ⚡ {t.songformer_btn}
            </button>}
          </div>
        </div>

        {/* row 2: editing + files */}
        <div className="row between" style={{ marginBottom: 12 }}>
          <div className="row">
            <button onClick={splitAtPlayhead} title={t.split_tip}>{t.split_btn}</button>
            <label className="chk">
              <input type="checkbox" checked={snap} onChange={e => setSnap(e.target.checked)} />
              {t.snap}
            </label>
          </div>
          <div className="row">
            <button onClick={() => currentFav && toggleFavorite(null, currentFav)}
              disabled={!currentFav}
              title={currentFav && currentFav.favorite ? t.fav_remove_tip : t.fav_add_tip}
              style={currentFav && currentFav.favorite ? { color: '#ffb84f', borderColor: '#ffb84f66' } : {}}>
              {currentFav && currentFav.favorite ? '★ ' + t.fav_in_lib : '☆ ' + t.fav_btn}
            </button>
            <div className="dropdown">
              <button className="ghost" onClick={() => setExportOpen(o => !o)}>
                {t.files_menu} ▾
              </button>
              {exportOpen && <div className="dropdown-menu" onClick={() => setExportOpen(false)}>
                <div className="dropdown-item" onClick={exportLoops}>{t.export_loops}</div>
                <div className="dropdown-item" onClick={exportMarkup}>{t.export_markup}</div>
                <div className="dropdown-item" onClick={() => markupRef.current.click()}>{t.import_markup}</div>
              </div>}
            </div>
            <input ref={markupRef} type="file" accept=".json" style={{ display: 'none' }}
              onChange={e => e.target.files[0] && importMarkup(e.target.files[0])} />
          </div>
        </div>

        <Waveform buffer={buffer} segments={segments} setSegments={setSegments}
          beats={analysis.beats} downbeats={analysis.downbeats} snap={snap}
          player={player} playingSeg={playingSeg} duration={duration} t={t}
          onSeekSeg={i => player.playing ? player.play(i) : (player.segIndex = i, force(x => x + 1))}
          beginEdit={beginEdit} commitEdit={commitEdit} aiWorking={aiWorking} />

        <div className="seg-list">
          {segments.map((s, i) => {
            const gi = s.group ? s.group.charCodeAt(0) - 65 : i;
            const col = SEG_COLORS[gi % SEG_COLORS.length];
            const q = s.loopability;
            const qc = q == null ? 'var(--muted)' : q > 0.75 ? '#34d399' : q > 0.55 ? '#ffb84f' : '#fb6a6a';
            return (
              <div key={i} className={'seg-chip' + (i === player.segIndex ? ' active' : '')}
                onClick={() => player.playing ? player.play(i) : (player.segIndex = i, force(x => x + 1))}>
                <div className="dot" style={{ background: col }}></div>
                <input value={s.label} onClick={e => e.stopPropagation()}
                  onChange={e => setSegments(segs => {
                    const ns = segs.map(x => ({ ...x }));
                    ns[i].label = e.target.value; return ns;
                  })} />
                <span className="time">{fmt(s.start)}–{fmt(s.end)}</span>
                {q != null && <span className="time" title={t.loop_quality_tip}
                  style={{ color: qc }}>⟳{Math.round(q * 100)}%</span>}
                <span className="x" title={t.loop_toggle_tip}
                  style={{ color: s.loop === false ? 'var(--danger)' : 'var(--accent2)' }}
                  onClick={e => {
                    e.stopPropagation();
                    setSegments(segs => {
                      const ns = segs.map(x => ({ ...x }));
                      ns[i].loop = ns[i].loop === false;
                      ns[i].transition = !ns[i].loop;
                      return ns;
                    });
                  }}>{s.loop === false ? '→' : '⟳'}</span>
                {s.loop === false && <span className="time"
                  style={{ color: 'var(--danger)' }}>{t.transition_badge}</span>}
                <span className="x tip" data-tip={t.stinger_tip}
                  style={{ color: (s.stinger && s.stinger !== 'none') ? 'var(--accent)' : 'var(--muted)' }}
                  onClick={e => {
                    e.stopPropagation();
                    setStingerMenu(stingerMenu === i ? null : i);
                  }}>♪{s.stinger && s.stinger !== 'none' ? '•' : ''}</span>
                {stingerMenu === i && <div className="dropdown-menu"
                  style={{ top: 'calc(100% + 4px)', left: 'auto', right: 0 }}
                  onClick={e => e.stopPropagation()}>
                  {['none', 'cymbal', 'boom', 'riser'].map(sg => (
                    <div key={sg}
                      className="dropdown-item"
                      style={s.stinger === sg || (!s.stinger && sg === 'none')
                        ? { color: 'var(--accent)' } : {}}
                      onClick={() => {
                        setSegments(segs => {
                          const ns = segs.map(x => ({ ...x }));
                          ns[i].stinger = sg === 'none' ? undefined : sg;
                          return ns;
                        });
                        setStingerMenu(null);
                        // sound preview on selection
                        if (sg !== 'none' && player.ctx && player.stingerBuffers[sg]) {
                          player._playStinger(sg, player.ctx.currentTime + 0.05);
                        }
                      }}>
                      {t['stinger_' + sg]}{sg !== 'none' ? ' ♪' : ''}
                    </div>
                  ))}
                </div>}
                <span className="x" title={t.split_seg_tip}
                  onClick={e => { e.stopPropagation(); splitSeg(i); }}>✂</span>
                <span className="x" title={t.del_seg}
                  onClick={e => { e.stopPropagation(); removeSeg(i); }}>✕</span>
              </div>
            );
          })}
        </div>
      </div>}

      {analysis && <div className="panel">
        <div className="panel-title">{t.player_title}</div>
        <div className="row between">
          <div className="row">
            {!player.playing
              ? <button className="primary" onClick={() => player.play()}>{t.play}</button>
              : <button onClick={() => player.stop()}>{t.stop}</button>}
            <button className={'go' + (player.advanceArmed ? ' armed' : '')}
              disabled={!player.playing || player.segIndex >= segments.length - 1}
              onClick={() => player.advance()}>
              {player.advanceArmed ? t.next_armed : t.next}
            </button>
          </div>
          <div className="now">
            {player.playing && <span className="eq"><i></i><i></i><i></i></span>}
            {player.playing
              ? <span>{t.playing} <b>{segments[player.segIndex] ? segments[player.segIndex].label : '–'}</b>
                  &nbsp;· {t.pass}{player.loopCount}{t.pass_suffix || ''}
                  {player.advanceArmed && ' ' + t.transition_planned}</span>
              : <span>{t.selected} <b>{segments[player.segIndex] ? segments[player.segIndex].label : '–'}</b></span>}
          </div>
        </div>
        {/* row: transition */}
        <div className="row" style={{ marginTop: 12 }}>
          <span className="badge">{t.trans_mode}</span>
          <div className="lang-switch">
            <button className={transMode === 'loop' ? 'on' : ''}
              onClick={() => setTransMode('loop')} title={t.mode_loop_tip}>{t.mode_loop}</button>
            <button className={transMode === 'phrase' ? 'on' : ''}
              onClick={() => setTransMode('phrase')} title={t.mode_phrase_tip}>{t.mode_phrase}</button>
          </div>
          {transMode === 'phrase' && <div className="lang-switch" title={t.phrase_len_tip}>
            <button className={phraseBars === 4 ? 'on' : ''}
              onClick={() => setPhraseBars(4)}>4 {t.bars}</button>
            <button className={phraseBars === 8 ? 'on' : ''}
              onClick={() => setPhraseBars(8)}>8 {t.bars}</button>
          </div>}
          <span className="badge tip" style={{ marginLeft: 12 }} data-tip={t.crossfade_tip}>{t.crossfade}</span>
          <input type="range" min="0" max="2" step="0.1" value={crossfade}
            style={{ width: 130, accentColor: 'var(--accent)' }}
            onChange={e => setCrossfade(+e.target.value)} />
          <span className="time" style={{ fontFamily: '"JetBrains Mono", monospace', fontSize: 12, color: 'var(--muted)' }}>
            {crossfade.toFixed(1)}s
          </span>
          <span className="badge tip" style={{ marginLeft: 12 }} data-tip={t.speed_tip}>{t.speed}</span>
          <input type="range" min="0.5" max="1.5" step="0.05" value={rate}
            style={{ width: 110, accentColor: 'var(--accent)' }}
            onChange={e => { const v = +e.target.value; setRateState(v); player.setRate(v); }} />
          <span className="time" style={{ fontFamily: '"JetBrains Mono", monospace', fontSize: 12,
                 color: rate !== 1 ? 'var(--accent)' : 'var(--muted)', cursor: 'pointer' }}
            title={t.speed_reset_tip}
            onClick={() => { setRateState(1); player.setRate(1); }}>
            {analysis ? Math.round(analysis.tempo * rate) + ' bpm' : 'x' + rate.toFixed(2)}
          </span>
        </div>
        {/* row: smoothing + stinger */}
        <div className="row" style={{ marginTop: 10 }}>
          <label className="chk tip" data-tip={t.tail_tip}>
            <input type="checkbox" checked={tailOn}
              onChange={e => { setTailOn(e.target.checked); player.tailEnabled = e.target.checked; }} />
            {t.tail_label}
          </label>
          <label className="chk tip" data-tip={t.bass_swap_tip}>
            <input type="checkbox" checked={bassSwapOn}
              onChange={e => { setBassSwapOn(e.target.checked); player.bassSwap = e.target.checked; }} />
            {t.bass_swap_label}
          </label>
        </div>
        {/* row: layers (vertical layering) */}
        {(deepAvailable || songformerAvailable) && <div className="row" style={{ marginTop: 10, alignItems: 'flex-start' }}>
          <span className="badge tip" data-tip={t.stems_tip}>{t.stems_label}</span>
          {stemsState !== 'ready'
            ? <button className="ai-btn" onClick={loadStems}
                disabled={stemsState === 'loading' || !!loading}>
                {stemsState === 'loading' ? t.stems_working : t.stems_btn}
              </button>
            : <React.Fragment>
                <div className="layer-grid">
                  {['drums', 'bass', 'other', 'vocals'].map(name => (
                    <div key={name} className={'layer-row' + (layers[name].on ? '' : ' off')}>
                      <label className="chk">
                        <input type="checkbox" checked={layers[name].on}
                          onChange={e => updateLayer(name, { on: e.target.checked })} />
                        <span className="layer-name">{t['layer_' + name]}</span>
                      </label>
                      <input type="range" min="0" max="1.5" step="0.01"
                        value={layers[name].vol}
                        disabled={!layers[name].on}
                        style={{ width: 110, accentColor: '#a06bff' }}
                        onChange={e => updateLayer(name, { vol: +e.target.value })} />
                      <span className="vol-num">{Math.round(layers[name].vol * 100)}%</span>
                    </div>
                  ))}
                </div>
                <button className="ghost" onClick={unloadStems}>{t.stems_off}</button>
              </React.Fragment>}
        </div>}
        <div className="hint">{t.keys_hint}</div>
      </div>}

      <footer>{t.footer} · <a href="https://github.com/Siziff/musslop" target="_blank">GitHub</a></footer>

      {toast && <div className="toast">{toast}</div>}

      <div className="volume-box" title={t.volume_tip}>
        <span className="vol-icon" onClick={() => setVolume(volume > 0 ? 0 : 1)}>
          {volume === 0 ? '🔇' : volume < 0.5 ? '🔉' : '🔊'}
        </span>
        <input type="range" min="0" max="1" step="0.01" value={volume}
          onChange={e => setVolume(+e.target.value)} />
        <span className="vol-num">{Math.round(volume * 100)}%</span>
        <span className="vol-icon" title={t.beep_tip}
          onClick={() => {
            // test beep straight to destination, bypassing master/stems/filters
            player._ensureCtx();
            const o = player.ctx.createOscillator();
            const g = player.ctx.createGain();
            g.gain.value = 0.25;
            o.frequency.value = 660;
            o.connect(g); g.connect(player.ctx.destination);
            o.start(); o.stop(player.ctx.currentTime + 0.25);
            setTimeout(() => force(x => x + 1), 300);
          }}>♪?</span>
        {player.ctx && player.ctx.state !== 'running' &&
          <span className="vol-num" style={{ color: 'var(--danger)', width: 'auto' }}>
            {player.ctx.state}
          </span>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
