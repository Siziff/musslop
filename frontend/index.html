<style>
  :root {
    --bg: #0a0d14;
    --panel: rgba(23, 28, 40, .72);
    --panel2: #1d2433;
    --text: #eef1f8; --muted: #8b94a8;
    --accent: #6a8dff; --accent2: #34d399; --danger: #fb6a6a;
    --border: #2a3245; --border-soft: #232a3b;
    --glow: rgba(106, 141, 255, .35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    background-image:
      radial-gradient(900px 480px at 12% -8%, rgba(106,141,255,.14), transparent 62%),
      radial-gradient(800px 460px at 92% -6%, rgba(52,211,153,.10), transparent 60%),
      radial-gradient(700px 700px at 50% 118%, rgba(106,141,255,.07), transparent 60%);
    background-attachment: fixed;
  }
  #root { max-width: 1180px; margin: 0 auto; padding: 28px 22px 60px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .logo { display: flex; align-items: baseline; gap: 12px; }
  h1 {
    font-size: 26px; margin: 0; letter-spacing: 3px; font-weight: 800;
    background: linear-gradient(90deg, #eef1f8 0%, #9db4ff 55%, #6a8dff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--muted); font-size: 13px; }
  .lang-switch {
    display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    background: var(--panel2);
  }
  .lang-switch button {
    border: none; border-radius: 0; background: transparent; padding: 7px 14px;
    font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .5px;
  }
  .lang-switch button.on { background: var(--accent); color: #fff; }
  .lang-switch button:hover:not(.on) { color: var(--text); border-color: transparent; }

  /* ---------- panels ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 16px; padding: 18px; margin-bottom: 16px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(0,0,0,.28);
  }
  .panel-title {
    font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 12px;
  }

  /* ---------- dropzone ---------- */
  .dropzone {
    position: relative;
    border: 1.5px dashed var(--border); border-radius: 14px;
    padding: 38px 20px; text-align: center; color: var(--muted);
    cursor: pointer; transition: border-color .2s, background .2s, box-shadow .2s;
    font-size: 14px;
  }
  .dropzone:hover, .dropzone.over {
    border-color: var(--accent); background: rgba(106,141,255,.06);
    box-shadow: inset 0 0 40px rgba(106,141,255,.05);
  }
  .dropzone .dz-icon { font-size: 26px; display: block; margin-bottom: 8px; opacity: .8; }
  .dropzone b { color: var(--text); }

  /* ---------- buttons & inputs ---------- */
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 16px; font-size: 14px; cursor: pointer;
    font-family: inherit; font-weight: 600;
    transition: border-color .15s, background .15s, transform .06s, box-shadow .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(106,141,255,.12); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .35; cursor: default; }
  button.primary {
    background: linear-gradient(135deg, #6a8dff, #4f6fe0); border-color: transparent; color: #fff;
    box-shadow: 0 4px 18px var(--glow);
  }
  button.primary:hover:not(:disabled) { box-shadow: 0 4px 26px var(--glow); border-color: transparent; }
  button.go {
    background: linear-gradient(135deg, #34d399, #1fae7c); border-color: transparent;
    color: #06231a; font-weight: 800;
    box-shadow: 0 4px 18px rgba(52,211,153,.3);
  }
  button.go:hover:not(:disabled) { box-shadow: 0 4px 26px rgba(52,211,153,.45); border-color: transparent; }
  button.go.armed { animation: pulse 1.1s infinite; }
  button.ghost { background: transparent; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(52,211,153,.22); } }

  input[type=number] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; width: 68px; font-size: 13px; font-family: inherit;
  }
  input[type=number]:focus { outline: none; border-color: var(--accent); }
  label.chk {
    display: inline-flex; gap: 7px; align-items: center; font-size: 13px;
    color: var(--muted); cursor: pointer; font-weight: 600;
  }
  label.chk input { accent-color: var(--accent); width: 15px; height: 15px; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }

  /* ---------- waveform ---------- */
  .canvas-wrap { position: relative; user-select: none; }
  canvas { display: block; width: 100%; border-radius: 12px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.5; }
  kbd {
    background: var(--panel2); border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--text);
  }

  /* ---------- segment chips ---------- */
  .seg-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .seg-chip {
    display: flex; align-items: center; gap: 7px;
    background: var(--panel2); border: 1px solid var(--border-soft);
    border-radius: 10px; padding: 6px 10px; font-size: 13px; cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }
  .seg-chip:hover { border-color: var(--border); }
  .seg-chip.active {
    border-color: var(--accent2);
    box-shadow: 0 0 0 1px var(--accent2), 0 0 16px rgba(52,211,153,.18);
  }
  .seg-chip .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .seg-chip input {
    background: transparent; border: none; color: var(--text);
    font-size: 13px; width: 88px; outline: none; font-family: inherit; font-weight: 600;
  }
  .seg-chip .time { color: var(--muted); font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .seg-chip .x { color: var(--muted); cursor: pointer; padding: 0 2px; border-radius: 4px; }
  .seg-chip .x:hover { color: var(--danger); }

  /* ---------- badges / status ---------- */
  .badge {
    background: var(--panel2); border: 1px solid var(--border-soft);
    border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--muted); font-weight: 600;
  }
  .badge b { color: var(--text); font-family: 'JetBrains Mono', monospace; font-weight: 600; }
  .status { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; color: var(--muted); }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    margin-top: 12px; padding: 10px 14px; border-radius: 10px; font-size: 13px;
    background: rgba(251,106,106,.08); border: 1px solid rgba(251,106,106,.35); color: var(--danger);
  }

  /* ---------- now playing ---------- */
  .now {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; padding: 9px 14px; border-radius: 10px;
    background: var(--panel2); border: 1px solid var(--border-soft);
  }
  .now b { color: var(--accent2); }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .eq i {
    width: 3px; background: var(--accent2); border-radius: 1px;
    animation: eq 1s ease-in-out infinite;
  }
  .eq i:nth-child(1) { height: 60%; animation-delay: 0s; }
  .eq i:nth-child(2) { height: 100%; animation-delay: .25s; }
  .eq i:nth-child(3) { height: 40%; animation-delay: .5s; }
  @keyframes eq { 0%,100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; opacity: .7; }
  footer a { color: var(--accent); text-decoration: none; }
</style>

function fmt(t) {
  if (t == null || isNaN(t)) return '–';
  const m = Math.floor(t / 60), s = t % 60;
  return `${m}:${s.toFixed(1).padStart(4, '0')}`;
}

// ============================ Player (Web Audio) ===========================
// Each loop pass is scheduled as a separate AudioBufferSourceNode with
// sample-accurate start; micro-fades (6 ms) remove clicks at seams.
// "Next" — the next scheduled chunk is taken from the next section.
class LoopPlayer {
  constructor() {
    this.ctx = null; this.buffer = null;
    this.segments = [];
    this.downbeats = [];
    this.playing = false;
    this.segIndex = 0;
    this.advanceArmed = false;
    this.loopEnabled = true;
    this.crossfade = 0;         // сек, 0 = стык по границе с микро-фейдом
    this.transitionMode = 'loop'; // 'loop' = в конце лупа, 'bar' = ближайший такт
    this.nextTime = 0;          // ctx time of the next chunk start
    this.queue = [];            // [{t0, t1, segIndex, trackStart}]
    this.sources = [];          // [{src, g}]
    this.timer = null;
    this.loopCount = 0;
    this.pendingPos = null;     // позиция, выбранная кликом до запуска
    this.onState = () => {};
    this.FADE = 0.006;
    this.LOOKAHEAD = 0.35;      // sec of scheduling lookahead
    this._reschedT = null;
  }
  _ensureCtx() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  setSegments(segs) {
    this.segments = segs;
    if (this.segIndex >= segs.length) this.segIndex = Math.max(0, segs.length - 1);
    // границы изменились во время игры — перепланировать с текущей позиции
    if (this.playing) {
      clearTimeout(this._reschedT);
      this._reschedT = setTimeout(() => {
        if (!this.playing) return;
        const pos = this.position();
        if (pos != null) this._restartAt(pos);
      }, 180);
    }
  }
  _segAt(pos) {
    let idx = this.segments.findIndex(s => pos >= s.start && pos < s.end);
    if (idx < 0) idx = this.segments.findIndex(s => pos < s.end);
    if (idx < 0) idx = this.segments.length - 1;
    return idx;
  }
  // Кусок аудио [from, to) на ctx-времени when.
  // fadeIn/fadeOut — длительности фейдов (equal-power при кроссфейде).
  _scheduleChunkRange(from, to, when, fadeIn = null, fadeOut = null) {
    const dur = to - from;
    if (dur <= 0.01) return 0;
    const src = this.ctx.createBufferSource();
    src.buffer = this.buffer;
    const g = this.ctx.createGain();
    const fi = Math.min(fadeIn != null ? fadeIn : this.FADE, dur / 2);
    const fo = Math.min(fadeOut != null ? fadeOut : this.FADE, dur / 2);
    g.gain.setValueAtTime(0, when);
    if (fi > 0.02) { // equal-power вход
      const N = 8;
      for (let k = 1; k <= N; k++)
        g.gain.linearRampToValueAtTime(Math.sin((k / N) * Math.PI / 2), when + fi * k / N);
    } else {
      g.gain.linearRampToValueAtTime(1, when + fi);
    }
    g.gain.setValueAtTime(1, when + dur - fo);
    if (fo > 0.02) {
      const N = 8;
      for (let k = 1; k <= N; k++)
        g.gain.linearRampToValueAtTime(Math.cos((k / N) * Math.PI / 2), when + dur - fo + fo * k / N);
    } else {
      g.gain.linearRampToValueAtTime(0, when + dur);
    }
    src.connect(g); g.connect(this.ctx.destination);
    src.start(when, from, dur);
    const rec = { src, g };
    this.sources.push(rec);
    src.onended = () => { this.sources = this.sources.filter(s => s !== rec); };
    return dur;
  }
  // Хвост предыдущей части, затухающий поверх начала новой (кроссфейд)
  _scheduleTail(from, when, xf) {
    const end = Math.min(from + xf, this.buffer.duration);
    if (end - from <= 0.02) return;
    const src = this.ctx.createBufferSource();
    src.buffer = this.buffer;
    const g = this.ctx.createGain();
    const N = 8, dur = end - from;
    g.gain.setValueAtTime(1, when);
    for (let k = 1; k <= N; k++)
      g.gain.linearRampToValueAtTime(Math.cos((k / N) * Math.PI / 2), when + dur * k / N);
    src.connect(g); g.connect(this.ctx.destination);
    src.start(when, from, dur);
    const rec = { src, g };
    this.sources.push(rec);
    src.onended = () => { this.sources = this.sources.filter(s => s !== rec); };
  }
  // Перезапуск с произвольной позиции трека (не сбрасывает playing)
  _restartAt(pos) {
    this.sources.forEach(s => { try { s.src.stop(); } catch (e) {} });
    this.sources = [];
    if (!this.segments.length || !this.buffer) return;
    const idx = this._segAt(pos);
    const seg = this.segments[idx];
    const from = Math.max(seg.start, Math.min(pos, seg.end - 0.05));
    this.segIndex = idx;
    this.lastPlannedIndex = idx;
    this.nextTime = this.ctx.currentTime + 0.06;
    const dur = this._scheduleChunkRange(from, seg.end, this.nextTime);
    this.queue = [{ t0: this.nextTime, t1: this.nextTime + dur,
                    segIndex: idx, trackStart: from, isLoopRepeat: false }];
    this.nextTime += dur;
    this.onState();
  }
  _tick() {
    if (!this.playing) return;
    const now = this.ctx.currentTime;
    while (this.queue.length > 1 && this.queue[1].t0 <= now) {
      this.queue.shift();
      const cur = this.queue[0];
      if (cur.isLoopRepeat) this.loopCount++;
      else this.loopCount = 1;
      this.segIndex = cur.segIndex;
      this.onState();
    }
    while (this.nextTime - now < this.LOOKAHEAD) {
      if (!this.segments.length) break;
      let idx = this.lastPlannedIndex;
      let isRepeat = true;
      if (this.advanceArmed || !this.loopEnabled) {
        if (idx + 1 < this.segments.length) { idx = idx + 1; isRepeat = false; }
        else { this.stop(); this.onState(); return; }
        this.advanceArmed = false;
        this.onState();
      }
      const seg = this.segments[idx];
      const xf = (!isRepeat && this.crossfade > 0.02) ? this.crossfade : 0;
      if (xf > 0) {
        // хвост прошлой части затухает поверх новой
        const prev = this.segments[this.lastPlannedIndex];
        this._scheduleTail(prev.end, this.nextTime, xf);
      }
      const dur = this._scheduleChunkRange(seg.start, seg.end, this.nextTime,
                                           xf > 0 ? xf : null, null);
      this.queue.push({ t0: this.nextTime, t1: this.nextTime + dur,
                        segIndex: idx, trackStart: seg.start,
                        isLoopRepeat: isRepeat && this.lastPlannedIndex === idx });
      this.lastPlannedIndex = idx;
      this.nextTime += dur;
    }
  }
  play(fromSeg = null) {
    this._ensureCtx();
    this.stop(false);
    if (fromSeg != null) { this.segIndex = fromSeg; this.pendingPos = null; }
    if (!this.segments.length || !this.buffer) return;
    this.playing = true;
    this.advanceArmed = false;
    this.loopCount = 1;
    const seg0 = this.segments[Math.min(this.segIndex, this.segments.length - 1)];
    const pos = (this.pendingPos != null && fromSeg == null) ? this.pendingPos : seg0.start;
    this.pendingPos = null;
    this.timer = setInterval(() => this._tick(), 60);
    this._restartAt(pos);
  }
  // Перемотка в произвольную точку трека (drag плейхеда / клик)
  seek(pos) {
    if (!this.segments.length) return;
    if (this.playing) {
      this.loopCount = 1;
      this.advanceArmed = false;
      this._restartAt(pos);
    } else {
      this.segIndex = this._segAt(pos);
      this.pendingPos = pos;
      this.onState();
    }
  }
  advance() {
    if (!this.playing) return;
    if (this.transitionMode === 'bar' && this.downbeats.length) {
      this._advanceAtNextBar();
    } else {
      this.advanceArmed = true;
    }
    this.onState();
  }
  // Переход на ближайшем downbeat, не дожидаясь конца лупа
  _advanceAtNextBar() {
    const pos = this.position();
    if (pos == null) return;
    if (this.segIndex + 1 >= this.segments.length) { this.advanceArmed = true; return; }
    const margin = 0.12; // мс на планирование
    const nb = this.downbeats.find(b => b > pos + margin);
    const seg = this.segments[this.segIndex];
    // если следующий такт уже за границей сегмента — обычный переход в конце лупа
    if (nb == null || nb >= seg.end - 0.05) { this.advanceArmed = true; return; }
    const now = this.ctx.currentTime;
    const Tt = now + (nb - pos);
    const nextSeg = this.segments[this.segIndex + 1];
    const xf = Math.max(this.crossfade, 0.03);
    // погасить всё текущее к моменту Tt (+xf хвост)
    this.sources.forEach(({ g }) => {
      try {
        g.gain.cancelScheduledValues(Tt);
        g.gain.setValueAtTime(g.gain.value, Tt);
        const N = 6;
        for (let k = 1; k <= N; k++)
          g.gain.linearRampToValueAtTime(Math.cos((k / N) * Math.PI / 2), Tt + xf * k / N);
      } catch (e) {}
    });
    const olds = this.sources.slice();
    setTimeout(() => olds.forEach(s => { try { s.src.stop(); } catch (e) {} }),
               (Tt - now + xf + 0.1) * 1000);
    this.sources = [];
    // новая часть с её начала
    this.nextTime = Tt;
    const dur = this._scheduleChunkRange(nextSeg.start, nextSeg.end, Tt,
                                         this.crossfade > 0.02 ? xf : null, null);
    this.queue = [
      { t0: now, t1: Tt, segIndex: this.segIndex, trackStart: pos, isLoopRepeat: false },
      { t0: Tt, t1: Tt + dur, segIndex: this.segIndex + 1,
        trackStart: nextSeg.start, isLoopRepeat: false },
    ];
    this.lastPlannedIndex = this.segIndex + 1;
    this.nextTime = Tt + dur;
  }
  stop(notify = true) {
    this.playing = false;
    this.advanceArmed = false;
    clearTimeout(this._reschedT);
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    this.sources.forEach(s => { try { s.src.stop(); } catch (e) {} });
    this.sources = [];
    this.queue = [];
    if (notify) this.onState();
  }
  position() {
    if (!this.playing || !this.ctx || !this.queue.length) return null;
    const now = this.ctx.currentTime;
    let cur = this.queue[0];
    for (const q of this.queue) if (q.t0 <= now) cur = q;
    if (now < cur.t0) return cur.trackStart;
    return cur.trackStart + (now - cur.t0);
  }
}

// ============================== Waveform ===================================
function Waveform({ buffer, segments, setSegments, beats, downbeats, snap,
                    player, playingSeg, duration, onSeekSeg, t }) {
  const canvasRef = useRef(null);
  const peaksRef = useRef(null);
  const dragRef = useRef(null);
  const viewRef = useRef({ t0: 0, t1: 0 }); // видимое окно (сек); t1=0 -> весь трек
  const [, force] = useState(0);
  const H = 190;

  useEffect(() => {
    if (!buffer) { peaksRef.current = null; return; }
    const W = 8192; // достаточно для зума
    const data = buffer.getChannelData(0);
    const step = Math.max(1, Math.floor(data.length / W));
    const peaks = new Float32Array(W * 2);
    for (let i = 0; i < W; i++) {
      let mn = 1, mx = -1;
      const s = i * step, e = Math.min(s + step, data.length);
      for (let j = s; j < e; j += 2) { const v = data[j]; if (v < mn) mn = v; if (v > mx) mx = v; }
      peaks[i * 2] = mn; peaks[i * 2 + 1] = mx;
    }
    peaksRef.current = { peaks, W };
    viewRef.current = { t0: 0, t1: 0 };
    force(x => x + 1);
  }, [buffer]);

  const view = () => {
    const v = viewRef.current;
    return (v.t1 > v.t0) ? v : { t0: 0, t1: duration || 1 };
  };

  const segColor = (s, i) => {
    if (s.group) {
      const gi = s.group.charCodeAt(0) - 65;
      return SEG_COLORS[gi % SEG_COLORS.length];
    }
    return SEG_COLORS[i % SEG_COLORS.length];
  };

  const draw = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = rect.width;
    ctx.fillStyle = '#10141d'; ctx.fillRect(0, 0, W, H);
    if (!duration) return;
    const { t0, t1 } = view();
    const span = t1 - t0;
    const tx = tt => ((tt - t0) / span) * W;

    // segment backgrounds
    segments.forEach((s, i) => {
      if (s.end < t0 || s.start > t1) return;
      const c = segColor(s, i);
      ctx.fillStyle = c + (i === playingSeg ? '40' : '1c');
      ctx.fillRect(tx(s.start), 0, tx(s.end) - tx(s.start), H);
    });

    // beats / downbeats (биты рисуем только при достаточном зуме)
    if (beats && span < duration * 0.6) {
      ctx.strokeStyle = '#ffffff14'; ctx.beginPath();
      for (const b of beats) { if (b < t0 || b > t1) continue; ctx.moveTo(tx(b), H - 14); ctx.lineTo(tx(b), H); }
      ctx.stroke();
    }
    if (downbeats) {
      ctx.strokeStyle = '#ffffff30'; ctx.beginPath();
      for (const b of downbeats) { if (b < t0 || b > t1) continue; ctx.moveTo(tx(b), H - 26); ctx.lineTo(tx(b), H); }
      ctx.stroke();
    }

    // waveform
    if (peaksRef.current) {
      const { peaks, W: PW } = peaksRef.current;
      ctx.strokeStyle = '#8fb0ec'; ctx.globalAlpha = 0.85;
      ctx.beginPath();
      const mid = H / 2, amp = H / 2 - 10;
      for (let x = 0; x < W; x++) {
        const tt = t0 + (x / W) * span;
        const pi = Math.min(PW - 1, Math.floor((tt / duration) * PW));
        ctx.moveTo(x + .5, mid + peaks[pi * 2] * amp);
        ctx.lineTo(x + .5, mid + peaks[pi * 2 + 1] * amp);
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    }

    // boundaries
    segments.forEach((s, i) => {
      if (i === 0 || s.start < t0 || s.start > t1) return;
      const x = tx(s.start);
      ctx.strokeStyle = '#ffffffcc'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      ctx.lineWidth = 1;
      ctx.fillStyle = '#ffffffcc';
      ctx.beginPath();
      ctx.moveTo(x - 5, 0); ctx.lineTo(x + 5, 0); ctx.lineTo(x, 8); ctx.fill();
    });

    // labels + качество лупа
    segments.forEach((s, i) => {
      if (s.end < t0 || s.start > t1) return;
      const c = segColor(s, i);
      ctx.fillStyle = c;
      ctx.font = '600 11px Manrope, sans-serif';
      const lx = Math.max(tx(s.start) + 6, 6);
      ctx.fillText(s.label, lx, 15);
      if (s.loopability != null) {
        const q = s.loopability;
        ctx.fillStyle = q > 0.75 ? '#34d399' : q > 0.55 ? '#ffb84f' : '#fb6a6a';
        ctx.font = '600 10px "JetBrains Mono", monospace';
        ctx.fillText('\u27F3' + Math.round(q * 100) + '%', lx, 28);
      }
    });

    // мини-карта при зуме
    if (span < duration * 0.999) {
      ctx.fillStyle = '#ffffff18';
      ctx.fillRect(0, H - 4, W, 4);
      ctx.fillStyle = '#6a8dff';
      ctx.fillRect((t0 / duration) * W, H - 4, Math.max(6, (span / duration) * W), 4);
    }

    // playhead (или позиция, выбранная до запуска / при перетаскивании)
    let pos = dragRef.current && dragRef.current.type === 'playhead'
      ? dragRef.current.pos
      : (player && player.position());
    if (pos == null && player && player.pendingPos != null) pos = player.pendingPos;
    if (pos != null && pos >= t0 && pos <= t1) {
      const x = tx(pos);
      const grad = ctx.createLinearGradient(x - 8, 0, x + 8, 0);
      grad.addColorStop(0, 'rgba(52,211,153,0)');
      grad.addColorStop(.5, 'rgba(52,211,153,.25)');
      grad.addColorStop(1, 'rgba(52,211,153,0)');
      ctx.fillStyle = grad; ctx.fillRect(x - 8, 0, 16, H);
      ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      // ручка плейхеда
      ctx.fillStyle = '#34d399';
      ctx.beginPath(); ctx.arc(x, 6, 5, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 1;
    }
  }, [segments, beats, downbeats, duration, playingSeg, player]);

  useEffect(() => {
    let raf;
    const loop = () => { draw(); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [draw]);

  const timeAt = e => {
    const rect = canvasRef.current.getBoundingClientRect();
    const { t0, t1 } = view();
    const tt = t0 + ((e.clientX - rect.left) / rect.width) * (t1 - t0);
    return Math.max(0, Math.min(duration, tt));
  };
  const tolTime = () => {
    const rect = canvasRef.current.getBoundingClientRect();
    const { t0, t1 } = view();
    return (8 / rect.width) * (t1 - t0);
  };
  const snapTime = tt => {
    if (!snap || !downbeats || !downbeats.length) return tt;
    let best = tt, bd = Infinity;
    for (const b of downbeats) { const d = Math.abs(b - tt); if (d < bd) { bd = d; best = b; } }
    const { t0, t1 } = view();
    return bd < (t1 - t0) * 0.01 + 0.35 ? best : tt;
  };

  // wheel: зум к курсору; shift+wheel / горизонтальный скролл: панорама
  const onWheel = e => {
    if (!duration) return;
    e.preventDefault();
    const { t0, t1 } = view();
    const span = t1 - t0;
    if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
      const dt = (e.deltaX || e.deltaY) / 500 * span;
      let n0 = t0 + dt, n1 = t1 + dt;
      if (n0 < 0) { n1 -= n0; n0 = 0; }
      if (n1 > duration) { n0 -= n1 - duration; n1 = duration; }
      viewRef.current = { t0: Math.max(0, n0), t1: Math.min(duration, n1) };
      return;
    }
    const cursor = timeAt(e);
    const factor = e.deltaY > 0 ? 1.25 : 0.8;
    let ns = Math.min(duration, Math.max(2, span * factor));
    const ratio = (cursor - t0) / span;
    let n0 = cursor - ns * ratio, n1 = n0 + ns;
    if (n0 < 0) { n1 -= n0; n0 = 0; }
    if (n1 > duration) { n0 -= n1 - duration; n1 = duration; }
    viewRef.current = ns >= duration ? { t0: 0, t1: 0 } : { t0: Math.max(0, n0), t1: n1 };
  };

  const onMouseDown = e => {
    if (!duration) return;
    const tt = timeAt(e);
    const tolT = tolTime();
    // 1) плейхед — приоритет
    const pos = (player && player.position()) ?? (player && player.pendingPos);
    if (pos != null && Math.abs(pos - tt) < tolT) {
      dragRef.current = { type: 'playhead', pos };
      e.preventDefault();
      return;
    }
    // 2) границы сегментов
    for (let i = 1; i < segments.length; i++) {
      if (Math.abs(segments[i].start - tt) < tolT) {
        dragRef.current = { type: 'bound', idx: i };
        e.preventDefault();
        return;
      }
    }
    // 3) клик по свободному месту — перемотка в эту точку
    player.seek(tt);
  };
  const onMouseMove = e => {
    const canvas = canvasRef.current;
    if (!canvas || !duration) return;
    const tt = timeAt(e);
    const d = dragRef.current;
    if (d && d.type === 'playhead') {
      d.pos = Math.max(0, Math.min(duration - 0.05, tt));
      return;
    }
    if (d && d.type === 'bound') {
      const i = d.idx;
      const lo = segments[i - 1].start + 0.5;
      const hi = segments[i].end - 0.5;
      const nt = Math.max(lo, Math.min(hi, snapTime(tt)));
      setSegments(segs => {
        const ns = segs.map(s => ({ ...s }));
        ns[i - 1].end = nt; ns[i].start = nt;
        return ns;
      });
      return;
    }
    const tolT = tolTime();
    const pos = (player && player.position()) ?? (player && player.pendingPos);
    const onPlayhead = pos != null && Math.abs(pos - tt) < tolT;
    const nearBound = segments.some((s, i) => i > 0 && Math.abs(s.start - tt) < tolT);
    canvas.style.cursor = onPlayhead ? 'grab' : nearBound ? 'ew-resize' : 'pointer';
  };
  const onMouseUp = () => {
    const d = dragRef.current;
    dragRef.current = null;
    if (d && d.type === 'playhead') player.seek(d.pos);
  };
  const onDblClick = e => {
    const tt = snapTime(timeAt(e));
    setSegments(segs => {
      const i = segs.findIndex(s => tt > s.start + 0.5 && tt < s.end - 0.5);
      if (i < 0) return segs;
      const ns = segs.map(s => ({ ...s }));
      const right = { start: tt, end: ns[i].end, label: ns[i].label + '·2' };
      ns[i] = { ...ns[i], end: tt };
      ns.splice(i + 1, 0, right);
      return ns;
    });
  };

  useEffect(() => {
    window.addEventListener('mouseup', onMouseUp);
    const cv = canvasRef.current;
    if (cv) cv.addEventListener('wheel', onWheel, { passive: false });
    return () => {
      window.removeEventListener('mouseup', onMouseUp);
      if (cv) cv.removeEventListener('wheel', onWheel);
    };
  }, [duration, segments]);

  return (
    <div className="canvas-wrap">
      <canvas ref={canvasRef} style={{ height: H }}
        onMouseDown={onMouseDown} onMouseMove={onMouseMove} onDoubleClick={onDblClick} />
      <div className="hint">{t.wave_hint}</div>
    </div>
  );
}

// ================================ App ======================================
function App() {
  const [lang, setLang] = useState(() => localStorage.getItem('musslop_lang') || 'ru');
  const t = STR[lang];
  const setLanguage = l => { setLang(l); localStorage.setItem('musslop_lang', l); document.documentElement.lang = l; };

  const [trackId, setTrackId] = useState(null);
  const [trackName, setTrackName] = useState('');
  const [loading, setLoading] = useState(null);
  const [error, setError] = useState(null);
  const [analysis, setAnalysis] = useState(null);
  const [segments, setSegments] = useState([]);
  const [buffer, setBuffer] = useState(null);
  const [snap, setSnap] = useState(true);
  const [nSeg, setNSeg] = useState('');
  const [dragOver, setDragOver] = useState(false);
  const [crossfade, setCrossfade] = useState(0);       // сек
  const [transMode, setTransMode] = useState('loop');  // 'loop' | 'bar'
  const [, force] = useState(0);
  const playerRef = useRef(null);
  const fileRef = useRef(null);
  const markupRef = useRef(null);
  const loopQT = useRef(null);

  if (!playerRef.current) playerRef.current = new LoopPlayer();
  const player = playerRef.current;
  useEffect(() => { player.onState = () => force(x => x + 1); }, []);
  useEffect(() => { player.setSegments(segments); }, [segments]);
  useEffect(() => { player.crossfade = crossfade; }, [crossfade]);
  useEffect(() => { player.transitionMode = transMode; }, [transMode]);
  useEffect(() => {
    if (analysis) player.downbeats = analysis.downbeats || [];
  }, [analysis]);
  useEffect(() => () => player.stop(false), []);

  // пересчёт качества лупа после ручного редактирования (debounce 800мс)
  useEffect(() => {
    if (!trackId || !segments.length) return;
    clearTimeout(loopQT.current);
    loopQT.current = setTimeout(async () => {
      try {
        const r = await fetch(`/api/loopability/${trackId}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(segments.map(s => ({ start: s.start, end: s.end }))),
        });
        if (!r.ok) return;
        const { loopability } = await r.json();
        setSegments(segs => segs.length === loopability.length
          ? segs.map((s, i) => ({ ...s, loopability: loopability[i] })) : segs);
      } catch (e) {}
    }, 800);
    return () => clearTimeout(loopQT.current);
  }, [trackId, segments.map(s => `${s.start.toFixed(2)}_${s.end.toFixed(2)}`).join('|')]);

  const exportLoops = async () => {
    if (!trackId) return;
    setLoading(t.exporting);
    try {
      const r = await fetch(`/api/export/${trackId}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(segments.map(s => ({ start: s.start, end: s.end, label: s.label }))),
      });
      if (!r.ok) throw new Error(t.err_export);
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (trackName || 'track').replace(/\.[^.]+$/, '') + '_loops.zip';
      a.click();
      URL.revokeObjectURL(a.href);
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setLoading(null);
    }
  };

  const exportMarkup = () => {
    const data = { track: trackName, tempo: analysis && analysis.tempo, segments };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (trackName || 'markup').replace(/\.[^.]+$/, '') + '.musslop.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const importMarkup = async file => {
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.segments) || !data.segments.length) throw new Error('no segments');
      const segs = data.segments
        .map(s => ({ start: +s.start, end: +s.end, label: String(s.label || '') }))
        .filter(s => isFinite(s.start) && isFinite(s.end) && s.end > s.start)
        .sort((a, b) => a.start - b.start);
      if (!segs.length) throw new Error('empty markup');
      setSegments(segs);
      setError(null);
    } catch (e) {
      setError(t.err_markup + ' ' + e.message);
    } finally {
      if (markupRef.current) markupRef.current.value = '';
    }
  };

  const upload = async file => {
    setError(null);
    player.stop();
    try {
      // Файл уже у браузера — декодируем его напрямую, без скачивания с сервера.
      // Параллельно отправляем на сервер для анализа структуры.
      setLoading(t.loading_decode);
      const fd = new FormData();
      fd.append('file', file);
      const uploadPromise = fetch('/api/upload', { method: 'POST', body: fd });

      const ab = await file.arrayBuffer();
      player._ensureCtx();
      const buf = await player.ctx.decodeAudioData(ab);
      player.buffer = buf;
      setBuffer(buf);

      setLoading(t.loading_upload);
      const r = await uploadPromise;
      if (!r.ok) throw new Error((await r.json()).detail || t.err_upload);
      const { track_id, name } = await r.json();
      setTrackId(track_id); setTrackName(name);

      await doAnalyze(track_id, null);
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setLoading(null);
    }
  };

  const doAnalyze = async (id, n) => {
    setLoading(t.loading_analyze);
    try {
      const q = n ? `?n_segments=${n}` : '';
      const r = await fetch(`/api/analyze/${id}${q}`);
      if (!r.ok) throw new Error((await r.json()).detail || t.err_analyze);
      const a = await r.json();
      setAnalysis(a);
      setSegments(a.segments);
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setLoading(null);
    }
  };

  const onDrop = e => {
    e.preventDefault(); setDragOver(false);
    const f = e.dataTransfer.files[0];
    if (f) upload(f);
  };

  const removeSeg = i => {
    if (segments.length <= 1) return;
    setSegments(segs => {
      const ns = segs.map(s => ({ ...s }));
      if (i === 0) { ns[1].start = ns[0].start; }
      else { ns[i - 1].end = ns[i].end; }
      ns.splice(i, 1);
      return ns;
    });
  };

  // Разрезать часть в точке pos (сек); привязка к ближайшему downbeat
  const splitAt = pos => {
    if (pos == null || !analysis) return;
    let tt = pos;
    const dbs = analysis.downbeats || [];
    if (dbs.length) {
      let best = tt, bd = Infinity;
      for (const b of dbs) { const d = Math.abs(b - tt); if (d < bd) { bd = d; best = b; } }
      if (bd < 2.5) tt = best;
    }
    setSegments(segs => {
      const i = segs.findIndex(s => tt > s.start + 0.5 && tt < s.end - 0.5);
      if (i < 0) return segs;
      const ns = segs.map(s => ({ ...s }));
      const right = { start: tt, end: ns[i].end, label: ns[i].label + '·2' };
      ns[i] = { ...ns[i], end: tt };
      ns.splice(i + 1, 0, right);
      return ns;
    });
  };

  // Разрезать в текущей позиции (играет / выбрана кликом), иначе — середина выбранной части
  const splitAtPlayhead = () => {
    let pos = player.position();
    if (pos == null) pos = player.pendingPos;
    if (pos == null && segments[player.segIndex]) {
      const s = segments[player.segIndex];
      pos = (s.start + s.end) / 2;
    }
    splitAt(pos);
  };

  // Разрезать конкретную часть пополам (по ближайшему такту к середине)
  const splitSeg = i => {
    const s = segments[i];
    if (!s) return;
    splitAt((s.start + s.end) / 2);
  };

  const playingSeg = player.playing ? player.segIndex : -1;
  const duration = analysis ? analysis.duration : 0;

  const splitRef = useRef(splitAtPlayhead);
  splitRef.current = splitAtPlayhead;

  useEffect(() => {
    const h = e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') { e.preventDefault(); player.playing ? player.stop() : player.play(); }
      if (e.code === 'ArrowRight' || e.code === 'Enter') { e.preventDefault(); player.advance(); }
      if (e.code === 'KeyS') { e.preventDefault(); splitRef.current(); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  return (
    <div>
      <header>
        <div className="logo">
          <h1>MUSSLOP</h1>
          <div className="sub">{t.tagline}</div>
        </div>
        <div className="lang-switch">
          <button className={lang === 'ru' ? 'on' : ''} onClick={() => setLanguage('ru')}>RU</button>
          <button className={lang === 'en' ? 'on' : ''} onClick={() => setLanguage('en')}>EN</button>
        </div>
      </header>

      <div className="panel">
        <div className="panel-title">{t.upload_title}</div>
        <div className={'dropzone' + (dragOver ? ' over' : '')}
          onClick={() => fileRef.current.click()}
          onDragOver={e => { e.preventDefault(); setDragOver(true); }}
          onDragLeave={() => setDragOver(false)}
          onDrop={onDrop}>
          <span className="dz-icon">♫</span>
          {trackName
            ? <span>{t.track} <b>{trackName}</b> {t.drop_replace}</span>
            : <span>{t.drop_hint}<br /><span style={{ fontSize: 12, opacity: .7 }}>{t.drop_formats}</span></span>}
          <input ref={fileRef} type="file" accept="audio/*" style={{ display: 'none' }}
            onChange={e => e.target.files[0] && upload(e.target.files[0])} />
        </div>
        {loading && <div className="status" style={{ marginTop: 12 }}><div className="spinner"></div>{loading}</div>}
        {error && <div className="error-box">{t.err_prefix} {error}</div>}
      </div>

      {analysis && <div className="panel">
        <div className="panel-title">{t.structure_title}</div>
        <div className="row between" style={{ marginBottom: 12 }}>
          <div className="row">
            <span className="badge">{t.tempo} <b>{analysis.tempo.toFixed(1)} BPM</b></span>
            <span className="badge">{t.duration} <b>{fmt(duration)}</b></span>
            <span className="badge">{t.parts} <b>{segments.length}</b></span>
            {analysis.fallback && <span className="badge" style={{ color: 'var(--danger)' }}>{t.fallback}</span>}
          </div>
          <div className="row">
            <label className="chk">
              <input type="checkbox" checked={snap} onChange={e => setSnap(e.target.checked)} />
              {t.snap}
            </label>
            <input type="number" min="2" max="24" placeholder={t.n_parts_ph}
              value={nSeg} onChange={e => setNSeg(e.target.value)} title={t.n_parts_tip} />
            <button onClick={() => doAnalyze(trackId, nSeg ? +nSeg : null)} disabled={!!loading}>
              {t.reanalyze}
            </button>
            <button className="ghost" onClick={exportMarkup} title={t.export_tip}>{t.export_markup}</button>
            <button className="ghost" onClick={() => markupRef.current.click()} title={t.import_tip}>{t.import_markup}</button>
            <button className="ghost" onClick={exportLoops} title={t.export_loops_tip} disabled={!!loading}>{t.export_loops}</button>
            <button onClick={splitAtPlayhead} title={t.split_tip}>{t.split_btn}</button>
            <input ref={markupRef} type="file" accept=".json" style={{ display: 'none' }}
              onChange={e => e.target.files[0] && importMarkup(e.target.files[0])} />
          </div>
        </div>

        <Waveform buffer={buffer} segments={segments} setSegments={setSegments}
          beats={analysis.beats} downbeats={analysis.downbeats} snap={snap}
          player={player} playingSeg={playingSeg} duration={duration} t={t}
          onSeekSeg={i => player.playing ? player.play(i) : (player.segIndex = i, force(x => x + 1))} />

        <div className="seg-list">
          {segments.map((s, i) => {
            const gi = s.group ? s.group.charCodeAt(0) - 65 : i;
            const col = SEG_COLORS[gi % SEG_COLORS.length];
            const q = s.loopability;
            const qc = q == null ? 'var(--muted)' : q > 0.75 ? '#34d399' : q > 0.55 ? '#ffb84f' : '#fb6a6a';
            return (
              <div key={i} className={'seg-chip' + (i === player.segIndex ? ' active' : '')}
                onClick={() => player.playing ? player.play(i) : (player.segIndex = i, force(x => x + 1))}>
                <div className="dot" style={{ background: col }}></div>
                <input value={s.label} onClick={e => e.stopPropagation()}
                  onChange={e => setSegments(segs => {
                    const ns = segs.map(x => ({ ...x }));
                    ns[i].label = e.target.value; return ns;
                  })} />
                <span className="time">{fmt(s.start)}–{fmt(s.end)}</span>
                {q != null && <span className="time" title={t.loop_quality_tip}
                  style={{ color: qc }}>⟳{Math.round(q * 100)}%</span>}
                <span className="x" title={t.split_seg_tip}
                  onClick={e => { e.stopPropagation(); splitSeg(i); }}>✂</span>
                <span className="x" title={t.del_seg}
                  onClick={e => { e.stopPropagation(); removeSeg(i); }}>✕</span>
              </div>
            );
          })}
        </div>
      </div>}

      {analysis && <div className="panel">
        <div className="panel-title">{t.player_title}</div>
        <div className="row between">
          <div className="row">
            {!player.playing
              ? <button className="primary" onClick={() => player.play()}>{t.play}</button>
              : <button onClick={() => player.stop()}>{t.stop}</button>}
            <button className={'go' + (player.advanceArmed ? ' armed' : '')}
              disabled={!player.playing || player.segIndex >= segments.length - 1}
              onClick={() => player.advance()}>
              {player.advanceArmed ? t.next_armed : t.next}
            </button>
          </div>
          <div className="now">
            {player.playing && <span className="eq"><i></i><i></i><i></i></span>}
            {player.playing
              ? <span>{t.playing} <b>{segments[player.segIndex] ? segments[player.segIndex].label : '–'}</b>
                  &nbsp;· {t.pass}{player.loopCount}
                  {player.advanceArmed && ' ' + t.transition_planned}</span>
              : <span>{t.selected} <b>{segments[player.segIndex] ? segments[player.segIndex].label : '–'}</b></span>}
          </div>
        </div>
        <div className="row" style={{ marginTop: 12 }}>
          <span className="badge">{t.trans_mode}</span>
          <div className="lang-switch">
            <button className={transMode === 'loop' ? 'on' : ''}
              onClick={() => setTransMode('loop')} title={t.mode_loop_tip}>{t.mode_loop}</button>
            <button className={transMode === 'bar' ? 'on' : ''}
              onClick={() => setTransMode('bar')} title={t.mode_bar_tip}>{t.mode_bar}</button>
          </div>
          <span className="badge" style={{ marginLeft: 12 }}>{t.crossfade}</span>
          <input type="range" min="0" max="2" step="0.1" value={crossfade}
            style={{ width: 130, accentColor: 'var(--accent)' }}
            onChange={e => setCrossfade(+e.target.value)} />
          <span className="time" style={{ fontFamily: '"JetBrains Mono", monospace', fontSize: 12, color: 'var(--muted)' }}>
            {crossfade.toFixed(1)}s
          </span>
        </div>
        <div className="hint">{t.keys_hint}</div>
      </div>}

      <footer>{t.footer} · <a href="https://github.com/Siziff/musslop" target="_blank">GitHub</a></footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
