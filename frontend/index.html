<script src="vendor/react.min.js"></script>

<style>
  /* ============ THEME: mono (default) — brutalist monochrome ============ */
  :root, [data-theme="mono"] {
    --bg: #111111; --panel: #171717; --panel2: #1f1f1f;
    --text: #f2f2f2; --muted: #7a7a7a;
    --accent: #d8ff3e; --accent2: #d8ff3e; --danger: #ff6b6b;
    --border: #2c2c2c; --border-soft: #232323;
    --glow: rgba(216,255,62,.25);
    --radius: 0px; --radius-sm: 0px;
    --font: 'Space Grotesk', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-title: 'Space Mono', monospace;
    --mono: 'Space Mono', 'JetBrains Mono', monospace;
    --btn-primary-bg: #d8ff3e; --btn-primary-fg: #111111;
    --btn-go-bg: #f2f2f2; --btn-go-fg: #111111;
    --btn-ai-bg: transparent; --btn-ai-fg: #d8ff3e; --btn-ai-border: #d8ff3e;
    --on-accent: #111111;
    --bg-image: none;
    --panel-shadow: none;
    --wave-bg: #141414;
    --wave-line: #f2f2f2;
    --wave-playhead: #d8ff3e;
    --wave-bound: rgba(242,242,242,.75);
    --wave-bar: rgba(242,242,242,.10);
    --wave-downbeat: rgba(242,242,242,.22);
    --wave-phrase: rgba(216,255,62,.4);
    --tip-bg: #1f1f1f;
  }
  /* ============ THEME: tavern — D&D fantasy ============ */
  [data-theme="tavern"] {
    --bg: #191009; --panel: #241a10; --panel2: #2f2213;
    --text: #ecdcbc; --muted: #a08a64;
    --accent: #d9a441; --accent2: #8fb35c; --danger: #cf6242;
    --border: #4b3720; --border-soft: #3a2a17;
    --glow: rgba(217,164,65,.3);
    --radius: 6px; --radius-sm: 4px;
    --font: 'Alegreya', 'PingFang SC', Georgia, serif;
    --font-title: 'IM Fell English', serif;
    --mono: 'JetBrains Mono', monospace;
    --btn-primary-bg: linear-gradient(180deg, #8a6420, #6b4c15);
    --btn-primary-fg: #f4e8cc;
    --btn-go-bg: linear-gradient(180deg, #5d7a3a, #45602a); --btn-go-fg: #eef4dd;
    --btn-ai-bg: linear-gradient(180deg, #6b4a8a, #503668);
    --btn-ai-fg: #efe3fb; --btn-ai-border: #8f6cb0;
    --on-accent: #241a10;
    --bg-image:
      radial-gradient(800px 500px at 15% -10%, rgba(217,164,65,.09), transparent 60%),
      radial-gradient(700px 450px at 90% -5%, rgba(207,98,66,.06), transparent 55%),
      url("data:image/svg+xml,%3Csvg width='140' height='140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.85' numOctaves='2'/%3E%3CfeColorMatrix values='0 0 0 0 0.10 0 0 0 0 0.065 0 0 0 0 0.04 0 0 0 0.4 0'/%3E%3C/filter%3E%3Crect width='140' height='140' filter='url(%23n)'/%3E%3C/svg%3E");
    --panel-shadow: 0 6px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(236,220,188,.05);
    --wave-bg: #150e07;
    --wave-line: #ecdcbc;
    --wave-playhead: #8fb35c;
    --wave-bound: rgba(217,164,65,.65);
    --wave-bar: rgba(236,220,188,.08);
    --wave-downbeat: rgba(236,220,188,.2);
    --wave-phrase: rgba(217,164,65,.5);
    --tip-bg: #2f2213;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font);
    background-image: var(--bg-image);
    background-attachment: fixed;
    transition: background .25s, color .25s;
  }
  #root { max-width: 1180px; margin: 0 auto; padding: 28px 22px 60px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;
           border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .logo { display: flex; align-items: baseline; gap: 14px; }
  h1 {
    font-size: 24px; margin: 0; letter-spacing: 1px; font-weight: 700;
    font-family: var(--font-title); color: var(--text);
  }
  h1::after { content: '_'; color: var(--accent); animation: blink 1.2s steps(1) infinite; }
  [data-theme="tavern"] h1 { color: var(--accent); text-shadow: 0 2px 12px var(--glow); font-size: 27px; }
  [data-theme="tavern"] h1::before { content: '⚔ '; }
  [data-theme="tavern"] h1::after { content: ''; animation: none; }
  @keyframes blink { 50% { opacity: 0; } }
  .sub { color: var(--muted); font-size: 13px; font-family: var(--mono); }
  [data-theme="tavern"] .sub { font-family: var(--font); font-style: italic; font-size: 13.5px; }
  .lang-switch {
    display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden;
    background: transparent;
  }
  .lang-switch button {
    border: none; border-radius: 0; background: transparent; padding: 7px 13px;
    font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .5px;
    box-shadow: none;
  }
  .lang-switch button.on { background: var(--accent); color: var(--on-accent); }
  .lang-switch button:hover:not(.on) { color: var(--text); border-color: transparent; box-shadow: none; }

  /* ---------- panels ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
    box-shadow: var(--panel-shadow);
    position: relative;
  }
  [data-theme="tavern"] .panel::before {
    content: ''; position: absolute; inset: 5px; pointer-events: none;
    border: 1px solid rgba(217,164,65,.15); border-radius: 3px;
  }
  .panel-title {
    font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 12px; font-family: var(--font-title);
  }
  .panel-title::before { content: '── '; }
  [data-theme="tavern"] .panel-title {
    font-size: 15px; color: var(--accent); text-transform: none; letter-spacing: 1.5px;
  }
  [data-theme="tavern"] .panel-title::before { content: ''; }
  [data-theme="tavern"] .panel-title::after { content: ' ❧'; color: var(--muted); }

  /* ---------- dropzone ---------- */
  .dropzone {
    position: relative;
    border: 1px dashed var(--border); border-radius: var(--radius);
    padding: 34px 20px; text-align: center; color: var(--muted);
    cursor: pointer; transition: border-color .2s, background .2s;
    font-size: 13.5px; font-family: var(--mono);
  }
  [data-theme="tavern"] .dropzone { font-family: var(--font); font-style: italic; font-size: 15px; border-width: 2px; }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); color: var(--text); }
  .dropzone .dz-icon { font-size: 24px; display: block; margin-bottom: 8px; opacity: .8; }
  .dz-compact {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 1px dashed var(--border); border-radius: var(--radius);
    padding: 10px 14px; color: var(--text); font-size: 13.5px; cursor: pointer;
    transition: border-color .2s;
  }
  .dz-compact:hover, .dz-compact.over { border-color: var(--accent); }
  .dz-compact-hint { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .dropzone b { color: var(--text); }

  /* ---------- buttons & inputs ---------- */
  button {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13.5px; cursor: pointer;
    font-family: var(--font); font-weight: 600;
    transition: border-color .12s, background .12s, color .12s;
  }
  [data-theme="tavern"] button { background: var(--panel2); font-size: 14.5px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .35; cursor: default; }
  button.primary {
    background: var(--btn-primary-bg); border-color: transparent; color: var(--btn-primary-fg);
    font-weight: 700;
  }
  [data-theme="tavern"] button.primary { border-color: #a87e2e; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  button.go {
    background: var(--btn-go-bg); border-color: transparent;
    color: var(--btn-go-fg); font-weight: 700;
  }
  [data-theme="tavern"] button.go { border-color: #8fb35c; }
  button.go.armed { animation: pulse 1.1s infinite; }
  button.ghost { background: transparent; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px var(--glow); } }

  input[type=number], input[type=text] {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; font-family: var(--mono);
  }
  input[type=number] { width: 68px; }
  input[type=number]:focus, input[type=text]:focus { outline: none; border-color: var(--accent); }
  label.chk {
    display: inline-flex; gap: 7px; align-items: center; font-size: 13px;
    color: var(--muted); cursor: pointer; font-weight: 600;
  }
  label.chk input { accent-color: var(--accent); width: 15px; height: 15px; }
  input[type=range] { accent-color: var(--accent); }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }

  /* ---------- waveform ---------- */
  .canvas-wrap { position: relative; user-select: none; }
  canvas { display: block; width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.5; }
  kbd {
    background: var(--panel2); border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; font-family: var(--mono);
    font-size: 11px; color: var(--text);
  }

  /* ---------- segment chips ---------- */
  .seg-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .seg-chip {
    position: relative;
    display: flex; align-items: center; gap: 7px;
    background: var(--panel2); border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm); padding: 6px 10px; font-size: 13px; cursor: pointer;
    transition: border-color .15s;
  }
  .seg-chip:hover { border-color: var(--border); }
  .seg-chip.active { border-color: var(--accent2); box-shadow: 0 0 0 1px var(--accent2); }
  .seg-chip .dot { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  [data-theme="tavern"] .seg-chip .dot { transform: rotate(45deg); border-radius: 1px; }
  .seg-chip input {
    background: transparent; border: none; color: var(--text);
    font-size: 13px; width: 88px; outline: none; font-family: var(--font); font-weight: 600;
    padding: 0;
  }
  .seg-chip .time { color: var(--muted); font-size: 11px; font-family: var(--mono); }
  .seg-chip .x { color: var(--muted); cursor: pointer; padding: 0 2px; }
  .seg-chip .x:hover { color: var(--danger); }

  /* ---------- badges / status ---------- */
  .badge {
    background: transparent; border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm); padding: 4px 10px; font-size: 12px; color: var(--muted); font-weight: 600;
  }
  .badge b { color: var(--text); font-family: var(--mono); font-weight: 600; }
  .status { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; color: var(--muted); }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    margin-top: 12px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px;
    border: 1px solid var(--danger); color: var(--danger);
  }

  /* ---------- now playing ---------- */
  .now {
    display: flex; align-items: center; gap: 10px;
    font-size: 13.5px; padding: 9px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft); font-family: var(--mono);
  }
  [data-theme="tavern"] .now { font-family: var(--font); }
  .now b { color: var(--accent2); font-weight: 600; }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .eq i {
    width: 3px; background: var(--accent2);
    animation: eq 1s ease-in-out infinite;
  }
  .eq i:nth-child(1) { height: 60%; animation-delay: 0s; }
  .eq i:nth-child(2) { height: 100%; animation-delay: .25s; }
  .eq i:nth-child(3) { height: 40%; animation-delay: .5s; }
  @keyframes eq { 0%,100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; opacity: .7; }
  footer a { color: var(--accent); text-decoration: none; }

  /* ---------- AI processing ---------- */
  button.ai-btn {
    background: var(--btn-ai-bg); border: 1px solid var(--btn-ai-border);
    color: var(--btn-ai-fg); font-weight: 700;
  }
  button.ai-btn:hover:not(:disabled) { box-shadow: 0 0 12px var(--glow); }
  .ai-overlay {
    position: absolute; inset: 0; border-radius: var(--radius-sm); overflow: hidden;
    background: rgba(0,0,0,.6);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 5;
  }
  .ai-overlay .scanline {
    position: absolute; top: 0; bottom: 0; width: 140px;
    background: linear-gradient(90deg, transparent, var(--glow), transparent);
    animation: scan 2.2s ease-in-out infinite;
  }
  @keyframes scan {
    0% { left: -140px; } 50% { left: calc(100% + 0px); } 100% { left: -140px; }
  }
  .ai-overlay .ai-title {
    font-size: 15px; font-weight: 700; letter-spacing: .5px; color: var(--accent);
    font-family: var(--font-title);
  }
  .ai-overlay .ai-stage { font-size: 12.5px; color: var(--muted); font-family: var(--mono); }
  .ai-bars { display: flex; gap: 4px; align-items: flex-end; height: 26px; }
  .ai-bars i {
    width: 5px; background: var(--accent);
    animation: aeq 1s ease-in-out infinite;
  }
  .ai-bars i:nth-child(1) { height: 40%; animation-delay: 0s; }
  .ai-bars i:nth-child(2) { height: 75%; animation-delay: .12s; }
  .ai-bars i:nth-child(3) { height: 100%; animation-delay: .24s; }
  .ai-bars i:nth-child(4) { height: 65%; animation-delay: .36s; }
  .ai-bars i:nth-child(5) { height: 85%; animation-delay: .48s; }
  .ai-bars i:nth-child(6) { height: 50%; animation-delay: .6s; }
  .ai-bars i:nth-child(7) { height: 70%; animation-delay: .72s; }
  @keyframes aeq { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

  /* ---------- volume control ---------- */
  .volume-box {
    position: fixed; right: 18px; bottom: 18px; z-index: 50;
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 9px 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  .volume-box .vol-icon { font-size: 15px; cursor: pointer; user-select: none; width: 20px; text-align: center; }
  .volume-box input[type=range] { width: 110px; }
  .volume-box .vol-num {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); width: 34px; text-align: right;
  }

  /* ---------- dropdown ---------- */
  .dropdown { position: relative; }
  .dropdown-menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 30;
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 5px; min-width: 190px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .dropdown-item {
    padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13.5px;
    cursor: pointer; white-space: nowrap;
  }
  .dropdown-item:hover { background: var(--panel); color: var(--accent); }

  /* ---------- custom tooltips ---------- */
  .tip { position: relative; cursor: help; }
  .tip::after {
    content: attr(data-tip);
    position: absolute; left: 50%; bottom: calc(100% + 8px);
    transform: translateX(-50%) translateY(4px);
    background: var(--tip-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 9px 12px; font-size: 12.5px; font-weight: 400; line-height: 1.45;
    width: max-content; max-width: 300px; white-space: normal;
    opacity: 0; pointer-events: none; z-index: 60;
    transition: opacity .15s, transform .15s;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
    font-family: var(--font);
  }
  .tip:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- stem layers ---------- */
  .layer-grid { display: flex; flex-direction: column; gap: 4px; }
  .layer-row {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm); padding: 5px 12px;
  }
  .layer-row.off { opacity: .45; }
  .layer-name { font-weight: 700; font-size: 13px; width: 86px; }
  [data-theme="tavern"] .layer-name { font-family: var(--font-title); font-weight: 400; font-size: 14.5px; }

  /* ---------- collapsible sections ---------- */
  .collapse-head {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    user-select: none; padding: 4px 0;
  }
  .collapse-head:hover .panel-title { color: var(--text); }
  .collapse-head .caret {
    font-size: 10px; color: var(--muted); transition: transform .15s;
  }
  .collapse-head .caret.open { transform: rotate(90deg); }
  .collapse-head .count {
    font-size: 11px; color: var(--muted);
    font-family: var(--mono);
  }

  /* ---------- theme switch ---------- */
  .theme-switch {
    display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm);
    overflow: hidden; margin-right: 10px;
  }
  .theme-switch button {
    border: none; border-radius: 0; background: transparent; padding: 7px 12px;
    font-size: 14px; color: var(--muted);
  }
  .theme-switch button.on { background: var(--accent); color: var(--on-accent); }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--accent); border-radius: var(--radius-sm);
    padding: 12px 18px; font-size: 13.5px; z-index: 70;
    max-width: 640px; box-shadow: 0 10px 40px rgba(0,0,0,.6);
    animation: toast-in .25s ease-out;
  }
  @keyframes toast-in {
    from { opacity: 0; transform: translateX(-50%) translateY(12px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
</style>

<script>
  // If React/Babel failed to load — show a clear error instead of a blank page
  window.addEventListener('load', function () {
    // Babel is only needed in dev mode (inline text/babel script)
    var needBabel = !!document.querySelector('script[type="text/babel"]');
    if (!window.React || !window.ReactDOM || (needBabel && !window.Babel)) {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;text-align:center;color:#fb6a6a;font-size:15px">' +
        'Не удалось загрузить скрипты (vendor/*.js). Обновите страницу (Ctrl+F5) ' +
        'или проверьте консоль браузера (F12).<br>' +
        'Failed to load scripts (vendor/*.js). Hard-refresh (Ctrl+F5) or check the browser console (F12).' +
        '</div>';
    }
  });
</script>

const SEG_COLORS = ['#6a8dff','#34d399','#ffb84f','#ff5b8a','#a06bff',

// =============================== i18n ======================================

// current theme colors from CSS variables (for canvas)
function themeColors() {
  const cs = getComputedStyle(document.documentElement);
  const v = name => cs.getPropertyValue(name).trim();
  return {
    waveBg: v('--wave-bg') || '#141414',
    waveLine: v('--wave-line') || '#f2f2f2',
    playhead: v('--wave-playhead') || '#d8ff3e',
    bound: v('--wave-bound') || 'rgba(242,242,242,.75)',
    bar: v('--wave-bar') || 'rgba(242,242,242,.1)',
    downbeat: v('--wave-downbeat') || 'rgba(242,242,242,.22)',
    phrase: v('--wave-phrase') || 'rgba(216,255,62,.4)',
    accent2: v('--accent2') || '#d8ff3e',
    danger: v('--danger') || '#ff6b6b',
  };
}

function fmt(t) {
  if (t == null || isNaN(t)) return '–';
  const m = Math.floor(t / 60), s = t % 60;
  return `${m}:${s.toFixed(1).padStart(4, '0')}`;
}

// ============================ Player (Web Audio) ===========================
// Each loop pass is scheduled as a separate AudioBufferSourceNode with
// sample-accurate start; micro-fades (6 ms) remove clicks at seams.
// "Next" — the next scheduled chunk is taken from the next section.
class LoopPlayer {
  constructor() {
    this.ctx = null; this.buffer = null;
    this.segments = [];
    this.downbeats = [];
    this.playing = false;
    this.segIndex = 0;
    this.advanceArmed = false;
    this.loopEnabled = true;
    this.crossfade = 0;         // sec, 0 = seam at the boundary with a micro-fade
    this.rate = 1;              // playback speed (0.5..1.5); changes tempo AND pitch
    this.transitionMode = 'loop'; // 'loop' = at loop end, 'phrase' = phrase boundary
    this.phraseBars = 4;          // phrase length in bars for 'phrase' mode
    this.tailEnabled = true;      // post-exit: the old part's tail rings out
    this.TAIL = 1.2;              // tail seconds
    this.bassSwap = true;         // incoming part's bass enters at the boundary
    this.stingerBuffers = {};     // name -> AudioBuffer
    this.stems = null;            // {drums,bass,other,vocals: AudioBuffer} | null
    this.stemGains = null;        // {name: GainNode}
    this.nextTime = 0;          // ctx time of the next chunk start
    this.queue = [];            // [{t0, t1, segIndex, trackStart}]
    this.sources = [];          // [{src, g}]
    this.timer = null;
    this.loopCount = 0;
    this.pendingPos = null;     // position picked by click before playback starts
    this.onState = () => {};
    this.FADE = 0.006;
    this.LOOKAHEAD = 0.35;      // sec of scheduling lookahead
    this._reschedT = null;
  }
  _ensureCtx() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.volume != null ? this.volume : 1;
      this.master.connect(this.ctx.destination);
      if (this.loadStingers) this.loadStingers();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  // Safari (webkit): decodeAudioData can be callback-only — promise wrapper
  decode(arrayBuffer) {
    return new Promise((resolve, reject) => {
      const p = this.ctx.decodeAudioData(arrayBuffer, resolve, reject);
      if (p && p.then) p.then(resolve, reject);
    });
  }
  setRate(v) {
    v = Math.max(0.5, Math.min(1.5, v));
    if (Math.abs(v - (this.rate || 1)) < 0.001) return;
    this.rate = v;
    if (!this.playing) return;
    // мгновенно меняем rate уже играющих источников (без перезапуска —
    // никакого дребезга при драге слайдера)...
    const now = this.ctx.currentTime;
    for (const r of this.sources) {
      for (const src of (r.srcs || [r.src])) {
        try {
          src.playbackRate.cancelScheduledValues(now);
          src.playbackRate.setValueAtTime(src.playbackRate.value, now);
          src.playbackRate.linearRampToValueAtTime(v, now + 0.08);
        } catch (e) {}
      }
    }
    // ...а план (границы кусков в ctx-времени) стал неверным — пересоберём
    // его ОДИН раз после окончания серии изменений
    clearTimeout(this._rateT);
    this._rateT = setTimeout(() => {
      if (!this.playing) return;
      const pos = this.position();
      if (pos != null) this._softRestartAt(pos);
    }, 350);
  }
  setVolume(v) {
    this.volume = v;
    if (this.master) {
      const now = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(now);
      this.master.gain.setValueAtTime(this.master.gain.value, now);
      this.master.gain.linearRampToValueAtTime(v, now + 0.03);
    }
  }
  setSegments(segs) {
    const prevSig = this._segSig;
    this._segSig = segs.map(s =>
      `${s.start.toFixed(3)}_${s.end.toFixed(3)}_${s.loopStart != null ? s.loopStart.toFixed(3) : ''}_${s.loop === false ? 0 : 1}`
    ).join('|');
    this.segments = segs;
    if (this.segIndex >= segs.length) this.segIndex = Math.max(0, segs.length - 1);
    // replan only if boundaries/flags actually changed,
    // not metadata (loopability, label)
    if (this.playing && prevSig !== undefined && prevSig !== this._segSig) {
      clearTimeout(this._reschedT);
      this._reschedT = setTimeout(() => {
        if (!this.playing) return;
        this._replan();
      }, 250);
    }
  }
  // Gently fade out and stop the sources (instead of a hard stop -> clicks)
  _fadeStopAll(fade = 0.05) {
    const now = this.ctx.currentTime;
    for (const r of this.sources) {
      try {
        if (r.when > now + 0.005) { (r.stopAll || (t => r.src.stop(t)))(now); continue; } // hasn't started yet
        const g = r.g.gain;
        g.cancelScheduledValues(now);
        g.setValueAtTime(g.value, now);
        g.linearRampToValueAtTime(0, now + fade);
        (r.stopAll || (t => r.src.stop(t)))(now + fade + 0.01);
      } catch (e) { try { (r.stopAll || (() => r.src.stop()))(); } catch (e2) {} }
    }
    this.sources = [];
  }
  // Live replan: the current chunk keeps playing, its end is adjusted to the
  // new boundary; future chunks are cancelled and rebuilt.
  _replan() {
    // Boundaries changed while playing. Instead of surgically editing the
    // already-scheduled source (fragile: stale durations, repeated drags),
    // do a seamless handover: restart from the SAME position with a short
    // crossfade — inaudible, and all new boundaries apply immediately.
    if (!this.playing || !this.buffer || !this.segments.length) return;
    const pos = this.position();
    if (pos == null) return;
    const idx = this._segAt(pos);
    const seg = this.segments[idx];
    this._softRestartAt(Math.max(seg.start, Math.min(pos, seg.end - 0.1)));
  }
  // Restart with a smooth fade of the old audio (for seek and edge cases)
  _softRestartAt(pos) {
    this._fadeStopAll(0.05);
    if (!this.segments.length || !this.buffer) return;
    const idx = this._segAt(pos);
    const seg = this.segments[idx];
    const from = Math.max(seg.start, Math.min(pos, seg.end - 0.05));
    this.segIndex = idx;
    this.lastPlannedIndex = idx;
    this.nextTime = this.ctx.currentTime + 0.06;
    const dur = this._scheduleChunkRange(from, seg.end, this.nextTime, 0.03, null);
    this.queue = [{ t0: this.nextTime, t1: this.nextTime + dur,
                    segIndex: idx, trackStart: from, isLoopRepeat: false }];
    this.nextTime += dur;
    this.onState();
  }
  _segAt(pos) {
    let idx = this.segments.findIndex(s => pos >= s.start && pos < s.end);
    if (idx < 0) idx = this.segments.findIndex(s => pos < s.end);
    if (idx < 0) idx = this.segments.length - 1;
    return idx;
  }
  // Audio chunk [from, to) at ctx time when.
  // fadeIn/fadeOut — fade durations (equal-power when crossfading).
  // opts.bassDelay — sec: the bass enters later (bass swap on transition).
  _scheduleChunkRange(from, to, when, fadeIn = null, fadeOut = null, opts = {}) {
    const dur = to - from;              // duration in track seconds
    if (dur <= 0.01) return 0;
    const rate = this.rate || 1;
    const ctxDur = dur / rate;          // real (context) duration
    const g = this.ctx.createGain();
    const fi = Math.min(fadeIn != null ? fadeIn : this.FADE, ctxDur / 2);
    const fo = Math.min(fadeOut != null ? fadeOut : this.FADE, ctxDur / 2);
    // equal-power (cos/sin) for uncorrelated material (section changes);
    // equal-GAIN (linear) for loop repeats: the loop's end and start are
    // similar (correlated), cos+sin would sum to +3dB at the seam
    const lin = !!opts.linearFade;
    g.gain.setValueAtTime(0, when);
    if (fi > 0.02) {
      if (lin) {
        g.gain.linearRampToValueAtTime(1, when + fi);
      } else {
        const N = 8;
        for (let k = 1; k <= N; k++)
          g.gain.linearRampToValueAtTime(Math.sin((k / N) * Math.PI / 2), when + fi * k / N);
      }
    } else {
      g.gain.linearRampToValueAtTime(1, when + fi);
    }
    g.gain.setValueAtTime(1, when + ctxDur - fo);
    if (fo > 0.02) {
      if (lin) {
        g.gain.linearRampToValueAtTime(0, when + ctxDur);
      } else {
        const N = 8;
        for (let k = 1; k <= N; k++)
          g.gain.linearRampToValueAtTime(Math.cos((k / N) * Math.PI / 2), when + ctxDur - fo + fo * k / N);
      }
    } else {
      g.gain.linearRampToValueAtTime(0, when + ctxDur);
    }
    g.connect(this.master);

    const started = [];
    if (this.stems) {
      // multi-stem: each layer via its own gain (intensity)
      this._ensureStemGains();
      for (const name of ['drums', 'bass', 'other', 'vocals']) {
        const buf = this.stems[name];
        if (!buf) continue;
        const s = this.ctx.createBufferSource();
        s.buffer = buf;
        const sg = this.stemGains[name];
        // bass swap: bass and drums are silent until boundary + fi, then a sharp entry
        if (opts.bassDelay && (name === 'bass' || name === 'drums')) {
          const dg = this.ctx.createGain();
          dg.gain.setValueAtTime(0, when);
          dg.gain.setValueAtTime(0, when + opts.bassDelay - 0.005);
          dg.gain.linearRampToValueAtTime(1, when + opts.bassDelay + 0.01);
          s.connect(dg); dg.connect(sg);
        } else {
          s.connect(sg);
        }
        s.playbackRate.value = rate;
        sg.connect(g);
        s.start(when, Math.min(from, buf.duration - 0.01), dur);
        started.push(s);
      }
    } else {
      const src = this.ctx.createBufferSource();
      src.buffer = this.buffer;
      if (opts.bassDelay && this.bassSwap) {
        // without stems: 2-band split, the low band enters with a delay
        const lo = this.ctx.createBiquadFilter();
        lo.type = 'lowpass'; lo.frequency.value = 180; lo.Q.value = 0.7;
        const hi = this.ctx.createBiquadFilter();
        hi.type = 'highpass'; hi.frequency.value = 180; hi.Q.value = 0.7;
        const loG = this.ctx.createGain();
        loG.gain.setValueAtTime(0, when);
        loG.gain.setValueAtTime(0, when + opts.bassDelay - 0.005);
        loG.gain.linearRampToValueAtTime(1, when + opts.bassDelay + 0.01);
        src.connect(lo); lo.connect(loG); loG.connect(g);
        src.connect(hi); hi.connect(g);
      } else {
        src.connect(g);
      }
      src.playbackRate.value = rate;
      src.start(when, from, dur);
      started.push(src);
    }
    const rec = { src: started[0], srcs: started, g, when, from, end: to, rate };
    this.sources.push(rec);
    started[0].onended = () => { this.sources = this.sources.filter(s => s !== rec); };
    // shared stop for multi-sources
    rec.stopAll = (t) => started.forEach(s => { try { t != null ? s.stop(t) : s.stop(); } catch (e) {} });
    return ctxDur;
  }
  _ensureStemGains() {
    if (this.stemGains) return;
    this.stemGains = {};
    for (const name of ['drums', 'bass', 'other', 'vocals']) {
      const gn = this.ctx.createGain();
      this.stemGains[name] = gn;
    }
    this.setLayers(this.layers || {});
  }
  // Intensity 0..1 -> layers: other always, bass from 0.25, drums from 0.5, vocals from 0.75
  // Per-layer control: {drums: {on: true, vol: 1}, ...}
  setLayers(layers) {
    this.layers = layers;
    if (!this.stemGains || !this.ctx) return;
    const now = this.ctx.currentTime;
    for (const name of ['drums', 'bass', 'other', 'vocals']) {
      const gn = this.stemGains[name];
      const st = layers[name] || { on: true, vol: 1 };
      const target = st.on ? st.vol : 0;
      gn.gain.cancelScheduledValues(now);
      gn.gain.setValueAtTime(gn.gain.value, now);
      gn.gain.linearRampToValueAtTime(target, now + 0.35);
    }
  }
  // Stinger: a single sound at the transition moment (name — from the target part)
  _playStinger(name, when) {
    const buf = this.stingerBuffers[name];
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const g = this.ctx.createGain();
    g.gain.value = 0.9;
    src.connect(g); g.connect(this.master);
    // a riser must END at the boundary, a boom/cymbal — start on it
    const t = name === 'riser'
      ? Math.max(this.ctx.currentTime, when - buf.duration)
      : when;
    src.start(t);
  }
  // Post-exit: the old part's tail rings out over the new one's start, fading
  _schedulePostExitTail(fromPos, when) {
    if (!this.tailEnabled) return;
    const rate = this.rate || 1;
    const end = Math.min(fromPos + this.TAIL * rate, this.buffer.duration);
    const dur = (end - fromPos) / rate;
    if (dur <= 0.05) return;
    const src = this.ctx.createBufferSource();
    src.buffer = this.buffer;
    src.playbackRate.value = rate;
    const g = this.ctx.createGain();
    const N = 8;
    g.gain.setValueAtTime(0.9, when);
    for (let k = 1; k <= N; k++)
      g.gain.linearRampToValueAtTime(0.9 * Math.cos((k / N) * Math.PI / 2), when + dur * k / N);
    src.connect(g); g.connect(this.master);
    src.start(when, fromPos, end - fromPos);
    const rec = { src, srcs: [src], g, when, from: fromPos, end, isTail: true,
                  stopAll: (t) => { try { t != null ? src.stop(t) : src.stop(); } catch (e) {} } };
    this.sources.push(rec);
    src.onended = () => { this.sources = this.sources.filter(s => s !== rec); };
  }
  // Restart from an arbitrary track position (does not reset playing)
  _restartAt(pos) {
    this.sources.forEach(s => { try { (s.stopAll || (() => s.src.stop()))(); } catch (e) {} });
    this.sources = [];
    if (!this.segments.length || !this.buffer) return;
    const idx = this._segAt(pos);
    const seg = this.segments[idx];
    const from = Math.max(seg.start, Math.min(pos, seg.end - 0.05));
    this.segIndex = idx;
    this.lastPlannedIndex = idx;
    this.nextTime = this.ctx.currentTime + 0.06;
    const dur = this._scheduleChunkRange(from, seg.end, this.nextTime);
    this.queue = [{ t0: this.nextTime, t1: this.nextTime + dur,
                    segIndex: idx, trackStart: from, isLoopRepeat: false }];
    this.nextTime += dur;
    this.onState();
  }
  _tick() {
    if (!this.playing) return;
    const now = this.ctx.currentTime;
    while (this.queue.length > 1 && this.queue[1].t0 <= now) {
      this.queue.shift();
      const cur = this.queue[0];
      if (cur.isLoopRepeat) this.loopCount++;
      else this.loopCount = 1;
      this.segIndex = cur.segIndex;
      this.onState();
    }
    while (this.nextTime - now < this.LOOKAHEAD) {
      if (!this.segments.length) break;
      let idx = this.lastPlannedIndex;
      let isRepeat = true;
      const curSeg = this.segments[idx];
      // a non-looped part (build-up) plays once and moves on
      const noLoop = curSeg && curSeg.loop === false;
      if (this.advanceArmed || !this.loopEnabled || noLoop) {
        if (idx + 1 < this.segments.length) { idx = idx + 1; isRepeat = false; }
        else { this.stop(); this.onState(); return; }
        this.advanceArmed = false;
        this.onState();

      const seg = this.segments[idx];
      // a loop repeat starts from loopStart (if set), the first entry — from start
      const from = (isRepeat && seg.loopStart != null

        ? seg.loopStart : seg.start;
      // Crossfade: chunks overlap by xf — the current one's end fades out
      // while the next one's start fades in (equal-power). Works both on
      // loop repeats (smooths the end->start seam) and on transitions.
      const chunkDur = seg.end - from;
      const xf = this.crossfade > 0.02 ? Math.min(this.crossfade, chunkDur / 3) : 0;
      const isSectionChange = !isRepeat && this.lastPlannedIndex !== idx;
      const opts = { linearFade: !isSectionChange };
      if (isSectionChange && this.bassSwap) {
        // the incoming part's bass enters exactly at the boundary (not in the crossfade)
        opts.bassDelay = Math.max(xf, 0.01);
      }
      const dur = this._scheduleChunkRange(from, seg.end, this.nextTime,

                                           xf > 0 ? xf : null, opts);
      if (isSectionChange) {
        // post-exit: the previous part's tail rings out over the new one
        const prev = this.segments[this.lastPlannedIndex];
        if (prev) this._schedulePostExitTail(prev.end, this.nextTime);
        // target part's stinger: a sound at its entry
        if (seg.stinger && seg.stinger !== 'none')
          this._playStinger(seg.stinger, this.nextTime);
      }
      this.queue.push({ t0: this.nextTime, t1: this.nextTime + dur,
                        segIndex: idx, trackStart: from,
                        isLoopRepeat: isRepeat && this.lastPlannedIndex === idx });
      this.lastPlannedIndex = idx;
      this.nextTime += dur - xf; // the next chunk starts overlapping
    }
  }
  play(fromSeg = null) {
    this._ensureCtx();
    this.stop(false);
    if (fromSeg != null) { this.segIndex = fromSeg; this.pendingPos = null; }
    if (!this.segments.length || !this.buffer) return;
    this.playing = true;
    this.advanceArmed = false;
    this.loopCount = 1;
    const seg0 = this.segments[Math.min(this.segIndex, this.segments.length - 1)];
    const pos = (this.pendingPos != null && fromSeg == null) ? this.pendingPos : seg0.start;
    this.pendingPos = null;
    this.timer = setInterval(() => this._tick(), 60);

  seek(pos) {
