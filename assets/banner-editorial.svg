<text x="66" y="205" fill="#f7f7ef" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="600">Your music. Your timing.</text>
<text x="66" y="248" fill="#9fa8b5" font-family="Arial,Helvetica,sans-serif" font-size="19">Loop a moment. Cue what comes next.</text>
