<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
<title id="title">musslop — Your music. Your timing.</title>
<desc id="desc">A musical loop continues until your cue moves it into the next section. Free and open source tools for tabletop sessions and game prototypes.</desc>
