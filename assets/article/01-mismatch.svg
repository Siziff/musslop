<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-label="Linear track timeline vs the pacing of a game session">
<rect width="1080" height="380" rx="16" fill="#111419"/>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d8ff3e'/></marker><marker id='ahb' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#8cb5de'/></marker></defs><text x='40' y='42' font-family='JetBrains Mono,Menlo,monospace' font-size='12' fill='#9fa8b5' text-anchor='start' letter-spacing='1'>THE MISMATCH</text><text x='40' y='80' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='20' font-weight='700' fill='#f7f7ef' text-anchor='start' >A track has one fixed timeline</text><rect x='40' y='100' width='1000' height='54' rx='10' fill='#1b2028' stroke='#2c333d' /><rect x='42' y='102' width='116' height='50' rx='6' fill='#6a8dff' stroke='none' opacity='.85'/><text x='100.0' y='133' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='14' font-weight='700' fill='#111419' text-anchor='middle' >Intro</text><rect x='162' y='102' width='216' height='50' rx='6' fill='#34d399' stroke='none' opacity='.85'/><text x='270.0' y='133' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='14' font-weight='700' fill='#111419' text-anchor='middle' >Verse</text><rect x='382' y='102' width='146' height='50' rx='6' fill='#ffb84f' stroke='none' opacity='.85'/><text x='455.0' y='133' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='14' font-weight='700' fill='#111419' text-anchor='middle' >Build-up</text><rect x='532' y='102' width='256' height='50' rx='6' fill='#ff5b8a' stroke='none' opacity='.85'/><text x='660.0' y='133' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='14' font-weight='700' fill='#111419' text-anchor='middle' >Chorus</text><rect x='792' y='102' width='246' height='50' rx='6' fill='#a06bff' stroke='none' opacity='.85'/><text x='915.0' y='133' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='14' font-weight='700' fill='#111419' text-anchor='middle' >Outro</text><text x='40' y='180' font-family='JetBrains Mono,Menlo,monospace' font-size='12' fill='#9fa8b5' text-anchor='start' letter-spacing='1'>0:00</text><text x='1040' y='180' font-family='JetBrains Mono,Menlo,monospace' font-size='12' fill='#9fa8b5' text-anchor='end' letter-spacing='1'>3:40</text><text x='40' y='240' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='20' font-weight='700' fill='#f7f7ef' text-anchor='start' >Your session has the same order — but every stage takes as long as it takes</text><rect x='40' y='260' width='1000' height='54' rx='10' fill='#1b2028' stroke='#2c333d' /><rect x='42' y='262' width='86' height='50' rx='6' fill='#6a8dff' stroke='none' opacity='.85'/><text x='85.0' y='293' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='14' font-weight='700' fill='#111419' text-anchor='middle' >Arrival</text><rect x='132' y='262' width='556' height='50' rx='6' fill='#34d399' stroke='none' opacity='.85'/><text x='410.0' y='293' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='14' font-weight='700' fill='#111419' text-anchor='middle' >Exploration · players talk for 20 min</text><rect x='692' y='262' width='106' height='50' rx='6' fill='#ff5b8a' stroke='none' opacity='.85'/><text x='745.0' y='293' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='14' font-weight='700' fill='#111419' text-anchor='middle' >Fight!</text><rect x='802' y='262' width='236' height='50' rx='6' fill='#a06bff' stroke='none' opacity='.85'/><text x='920.0' y='293' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='14' font-weight='700' fill='#111419' text-anchor='middle' >Aftermath</text><line x1='380' y1='154' x2='380' y2='262' stroke='#ff6b6b' stroke-width='2' stroke-dasharray='5 4'/><text x='388' y='215' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='13' font-weight='500' fill='#ff6b6b' text-anchor='start' >build-up &amp; chorus fire while the party is still exploring</text><line x1='690' y1='154' x2='690' y2='262' stroke='#d8ff3e' stroke-width='2' stroke-dasharray='5 4'/><text x='698' y='200' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='13' font-weight='500' fill='#d8ff3e' text-anchor='start' >the fight starts — the track is already in the outro</text><text x='40' y='350' font-family='JetBrains Mono,Menlo,monospace' font-size='12' fill='#d8ff3e' text-anchor='start' letter-spacing='1'>musslop: loop the section the scene needs, cue the next one when YOU decide</text>
</svg>