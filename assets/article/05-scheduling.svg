<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-label="Web Audio scheduling: cues land on musical boundaries">
<rect width="1080" height="480" rx="16" fill="#111419"/>
<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d8ff3e'/></marker><marker id='ahb' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#8cb5de'/></marker></defs><text x='40' y='42' font-family='JetBrains Mono,Menlo,monospace' font-size='12' fill='#9fa8b5' text-anchor='start' letter-spacing='1'>PLAYBACK: EVERY LOOP PASS IS ITS OWN AudioBufferSourceNode</text><line x1='40' y1='190' x2='1040' y2='190' stroke='#2c333d' stroke-width='2'/><text x='40' y='215' font-family='JetBrains Mono,Menlo,monospace' font-size='11' fill='#9fa8b5' text-anchor='start' letter-spacing='1'>audio-context clock →</text><rect x='40' y='120' width='230' height='56' rx='6' fill='#34d399' stroke='none' opacity='.85'/><text x='155.0' y='153' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='13' font-weight='700' fill='#111419' text-anchor='middle' >Verse · pass 1</text><rect x='270' y='120' width='230' height='56' rx='6' fill='#34d399' stroke='none' opacity='.85'/><text x='385.0' y='153' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='13' font-weight='700' fill='#111419' text-anchor='middle' >Verse · pass 2</text><rect x='500' y='120' width='230' height='56' rx='6' fill='#34d399' stroke='none' opacity='.85'/><text x='615.0' y='153' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='13' font-weight='700' fill='#111419' text-anchor='middle' >Verse · pass 3</text><rect x='730' y='120' width='310' height='56' rx='6' fill='#ff5b8a' stroke='none' opacity='.85'/><text x='885.0' y='153' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='13' font-weight='700' fill='#111419' text-anchor='middle' >Chorus · pass 1</text><path d='M40 176 L48 120 M262 120 L270 176' stroke='#111419' stroke-width='1.5' fill='none' opacity='.5'/><path d='M270 176 L278 120 M492 120 L500 176' stroke='#111419' stroke-width='1.5' fill='none' opacity='.5'/><path d='M500 176 L508 120 M722 120 L730 176' stroke='#111419' stroke-width='1.5' fill='none' opacity='.5'/><path d='M730 176 L738 120 M1032 120 L1040 176' stroke='#111419' stroke-width='1.5' fill='none' opacity='.5'/><line x1='330' y1='80' x2='330' y2='190' stroke='#d8ff3e' stroke-width='2.5'/><text x='338' y='96' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='13' font-weight='700' fill='#d8ff3e' text-anchor='start' >you press Next / click a part</text><text x='338' y='112' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='12' font-weight='500' fill='#d8ff3e' text-anchor='start' >= a CUE, not a seek</text><rect x='330' y='178' width='400' height='8' fill='#d8ff3e' opacity='.35'/><text x='530' y='204' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='11.5' font-weight='500' fill='#9fa8b5' text-anchor='middle' >keeps looping · the target is scheduled for the boundary</text><line x1='730' y1='110' x2='730' y2='190' stroke='#d8ff3e' stroke-width='2.5' stroke-dasharray='6 4'/><text x='738' y='120' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='12' font-weight='500' fill='#d8ff3e' text-anchor='start' >transition lands here</text><rect x='690' y='128' width='40' height='40' fill='none' stroke='#f7f7ef' stroke-dasharray='3 3' opacity='.6'/><text x='710' y='230' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='11.5' font-weight='500' fill='#9fa8b5' text-anchor='middle' >0.35 s lookahead: the next chunk is scheduled just before the current one ends</text><text x='40' y='280' font-family='JetBrains Mono,Menlo,monospace' font-size='12' fill='#9fa8b5' text-anchor='start' letter-spacing='1'>THREE WAYS TO LAND A CUE</text><rect x='40' y='300' width='320' height='120' rx='10' fill='#1b2028' stroke='#d8ff3e' /><text x='56' y='330' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='18' font-weight='700' fill='#d8ff3e' text-anchor='start' >natural</text><text x='56' y='356' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='12.5' font-weight='500' fill='#f7f7ef' text-anchor='start' >wait for the end of the current loop pass</text><text x='56' y='390' font-family='JetBrains Mono,Menlo,monospace' font-size='11' fill='#9fa8b5' text-anchor='start' letter-spacing='1'>lands: loop end</text><line x1='56' y1='406' x2='344' y2='406' stroke='#2c333d'/><circle cx='340' cy='406' r='6' fill='#d8ff3e'/><circle cx='80' cy='406' r='3' fill='#f7f7ef' opacity='.5'/><rect x='380' y='300' width='320' height='120' rx='10' fill='#1b2028' stroke='#2c333d' /><text x='396' y='330' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='18' font-weight='700' fill='#d8ff3e' text-anchor='start' >soon</text><text x='396' y='356' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='12.5' font-weight='500' fill='#f7f7ef' text-anchor='start' >next 4- or 8-bar phrase boundary (downbeats)</text><text x='396' y='390' font-family='JetBrains Mono,Menlo,monospace' font-size='11' fill='#9fa8b5' text-anchor='start' letter-spacing='1'>lands: phrase</text><line x1='396' y1='406' x2='684' y2='406' stroke='#2c333d'/><circle cx='530' cy='406' r='6' fill='#d8ff3e'/><circle cx='420' cy='406' r='3' fill='#f7f7ef' opacity='.5'/><rect x='720' y='300' width='320' height='120' rx='10' fill='#1b2028' stroke='#2c333d' /><text x='736' y='330' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='18' font-weight='700' fill='#d8ff3e' text-anchor='start' >now</text><text x='736' y='356' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='12.5' font-weight='500' fill='#f7f7ef' text-anchor='start' >right away, short equal-power crossfade</text><text x='736' y='390' font-family='JetBrains Mono,Menlo,monospace' font-size='11' fill='#9fa8b5' text-anchor='start' letter-spacing='1'>lands: immediately</text><line x1='736' y1='406' x2='1024' y2='406' stroke='#2c333d'/><circle cx='760' cy='406' r='6' fill='#d8ff3e'/><circle cx='760' cy='406' r='3' fill='#f7f7ef' opacity='.5'/><text x='40' y='455' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='12' font-weight='500' fill='#9fa8b5' text-anchor='start' >Plus: post-exit tail of the old section rings over the new start · bass swap · optional stinger (hit starts on the boundary, riser ENDS on it).</text>
</svg>