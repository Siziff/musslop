<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='470' viewBox='0 0 1080 470' role='img' aria-label='Web Audio scheduling and the three cue modes'><rect width='1080' height='470' rx='16' fill='#111419'/><defs><marker id='ah' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L8,4 L0,8 z' fill='#d8ff3e'/></marker></defs><text x='40.0' y='44.0' font-family='JetBrains Mono,Menlo,monospace' font-size='10.5' fill='#d8ff3e' text-anchor='start' letter-spacing='1.2'>EVERY LOOP PASS IS ITS OWN AUDIOBUFFERSOURCENODE, SCHEDULED ON THE AUDIO CLOCK</text><line x1='40.0' y1='176.0' x2='1040.0' y2='176.0' stroke='#2c333d' stroke-width='2'/><text x='1040.0' y='194.0' font-family='JetBrains Mono,Menlo,monospace' font-size='10' fill='#9fa8b5' text-anchor='end' letter-spacing='1.2'>audio-context time →</text><rect x='41.0' y='110.0' width='223.0' height='50.0' rx='6' fill='#34d399' stroke='none' opacity='0.9'/><text x='152.5' y='140.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='13.0' font-weight='700' fill='#111419' text-anchor='middle'>Verse · pass 1</text><rect x='266.0' y='110.0' width='223.0' height='50.0' rx='6' fill='#34d399' stroke='none' opacity='0.9'/><text x='377.5' y='140.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='13.0' font-weight='700' fill='#111419' text-anchor='middle'>Verse · pass 2</text><rect x='491.0' y='110.0' width='223.0' height='50.0' rx='6' fill='#34d399' stroke='none' opacity='0.9'/><text x='602.5' y='140.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='13.0' font-weight='700' fill='#111419' text-anchor='middle'>Verse · pass 3</text><rect x='716.0' y='110.0' width='323.0' height='50.0' rx='6' fill='#ff5b8a' stroke='none' opacity='0.9'/><text x='877.5' y='140.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='13.0' font-weight='700' fill='#111419' text-anchor='middle'>Chorus · pass 1</text><line x1='340.0' y1='60.0' x2='340.0' y2='104.0' stroke='#d8ff3e' stroke-width='2.5'/><circle cx='340.0' cy='104.0' r='4' fill='#d8ff3e'/><text x='350.0' y='72.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='13.0' font-weight='700' fill='#d8ff3e' text-anchor='start'>you press Next / click a part</text><text x='350.0' y='90.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='12.0' font-weight='500' fill='#d8ff3e' text-anchor='start'>= a cue, not a seek</text><line x1='715.0' y1='162.0' x2='715.0' y2='200.0' stroke='#d8ff3e' stroke-width='2.5' stroke-dasharray='6 4'/><rect x='340' y='164' width='375' height='6' fill='#d8ff3e' opacity='.35'/><text x='527.5' y='212.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='11.5' font-weight='500' fill='#9fa8b5' text-anchor='middle'>keeps looping · the target is scheduled for the boundary</text><text x='723.0' y='194.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='12.0' font-weight='500' fill='#d8ff3e' text-anchor='start'>lands here</text><text x='40.0' y='228.0' font-family='JetBrains Mono,Menlo,monospace' font-size='10.5' fill='#d8ff3e' text-anchor='start' letter-spacing='1.2'>THREE WAYS TO LAND A CUE</text><rect x='40.0' y='242.0' width='320.0' height='118.0' rx='10' fill='#1b2028' stroke='#d8ff3e' opacity='1'/><text x='56.0' y='272.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='18.0' font-weight='700' fill='#d8ff3e' text-anchor='start'>natural</text><text x='56.0' y='296.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='12.5' font-weight='500' fill='#f7f7ef' text-anchor='start'>end of the current loop pass</text><line x1='56.0' y1='332.0' x2='344.0' y2='332.0' stroke='#2c333d' stroke-width='2'/><circle cx='56.0' cy='332.0' r='3' fill='#9fa8b5'/><circle cx='344.0' cy='332.0' r='6' fill='#d8ff3e'/><text x='56.0' y='350.0' font-family='JetBrains Mono,Menlo,monospace' font-size='9' fill='#9fa8b5' text-anchor='start' letter-spacing='1.2'>NOW</text><text x='344.0' y='350.0' font-family='JetBrains Mono,Menlo,monospace' font-size='9' fill='#9fa8b5' text-anchor='end' letter-spacing='1.2'>LOOP END</text><rect x='380.0' y='242.0' width='320.0' height='118.0' rx='10' fill='#1b2028' stroke='#2c333d' opacity='1'/><text x='396.0' y='272.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='18.0' font-weight='700' fill='#d8ff3e' text-anchor='start'>soon</text><text x='396.0' y='296.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='12.5' font-weight='500' fill='#f7f7ef' text-anchor='start'>next 4- or 8-bar phrase boundary</text><line x1='396.0' y1='332.0' x2='684.0' y2='332.0' stroke='#2c333d' stroke-width='2'/><circle cx='396.0' cy='332.0' r='3' fill='#9fa8b5'/><circle cx='525.6' cy='332.0' r='6' fill='#d8ff3e'/><text x='396.0' y='350.0' font-family='JetBrains Mono,Menlo,monospace' font-size='9' fill='#9fa8b5' text-anchor='start' letter-spacing='1.2'>NOW</text><text x='684.0' y='350.0' font-family='JetBrains Mono,Menlo,monospace' font-size='9' fill='#9fa8b5' text-anchor='end' letter-spacing='1.2'>LOOP END</text><rect x='720.0' y='242.0' width='320.0' height='118.0' rx='10' fill='#1b2028' stroke='#2c333d' opacity='1'/><text x='736.0' y='272.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='18.0' font-weight='700' fill='#d8ff3e' text-anchor='start'>now</text><text x='736.0' y='296.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='12.5' font-weight='500' fill='#f7f7ef' text-anchor='start'>right away, short crossfade</text><line x1='736.0' y1='332.0' x2='1024.0' y2='332.0' stroke='#2c333d' stroke-width='2'/><circle cx='736.0' cy='332.0' r='3' fill='#9fa8b5'/><circle cx='736.0' cy='332.0' r='6' fill='#d8ff3e'/><text x='736.0' y='350.0' font-family='JetBrains Mono,Menlo,monospace' font-size='9' fill='#9fa8b5' text-anchor='start' letter-spacing='1.2'>NOW</text><text x='1024.0' y='350.0' font-family='JetBrains Mono,Menlo,monospace' font-size='9' fill='#9fa8b5' text-anchor='end' letter-spacing='1.2'>LOOP END</text><text x='40.0' y='410.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='13.0' font-weight='500' fill='#9fa8b5' text-anchor='start'>Plus: the old section’s tail rings over the new start · bass swap · optional stinger</text><text x='40.0' y='432.0' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='13.0' font-weight='500' fill='#9fa8b5' text-anchor='start'>(a hit starts on the boundary, a riser ends on it).</text></svg>